      '<button class="btn btn-ghost btn-sm" type="button" id="pf-add-section" style="margin-top:8px;">+ Add Section</button>'+
    '</div>'+
    '<div class="ff"><label>Dishes (assign each to a section above)</label>'+
      '<div id="pf-dishes">'+dishRows+'</div>'+
      '<button class="btn btn-ghost btn-sm" id="pf-add-dish" type="button">+ Add Dish</button>'+
    '</div>'+
    '<button class="btn btn-gold btn-sm" type="button" id="pf-preview-btn" style="margin-top:12px;">👁 Preview as Customer</button>'+
    '<div id="pf-preview-area"></div>'+
    '<div class="hint-sm">Set upcharge to $0 for included options. Items with upcharge &gt; $0 will show "+$X" on the menu.</div>'+
  '</div>';

  openModal(isNew?'New Prix Fixe Menu':'Edit Prix Fixe Menu', body, isNew?'Create':'Save', function(){
    pf.name=$('pf-name').value.trim();
    if(!pf.name){ toast('Enter a name','error'); return false; }
    pf.subtitle=$('pf-sub').value.trim();
    pf.price=parseFloat($('pf-price').value)||0;
    pf.service=$('pf-service').value;
    pf.active=$('pf-active').value==='Active';

    /* Collect sections */
    var prevDishes=pf.dishes||[];
    var secRows=document.querySelectorAll('.pf-sec-row');
    pf.courses=[];
    secRows.forEach(function(row,i){
      var label=row.querySelector('.pf-sec-name').value.trim();
      if(!label) return;
      var modeEl=row.querySelector('.pf-sec-mode');
      var mode=modeEl?modeEl.value:'choose';
      pf.courses.push({
        id:row.getAttribute('data-sec-id')||uid('pfc'),
        label:label,
        order:i,
        mode:mode,
        fireEach:mode==='auto',
        fireAfter:mode==='later'||mode==='entremets'?'main':''
      });
    });

    /* Collect dishes */
    var dishEls=document.querySelectorAll('#pf-dishes .pf-opt-row');
    pf.dishes=[];
    dishEls.forEach(function(el,i){
      var name=el.querySelector('.pf-o-name').value.trim();
      if(!name) return;
      var id=el.getAttribute('data-dish-id')||uid('pfd');
      var prev=prevDishes.filter(function(x){return x.id===id;})[0]||{};
      var allergenRaw=el.querySelector('.pf-o-allergens')?el.querySelector('.pf-o-allergens').value:'';
      pf.dishes.push({
        id:id,
        name:name,
        course:el.querySelector('.pf-o-category').value,
        station:el.querySelector('.pf-o-station')?el.querySelector('.pf-o-station').value:'Cold / Garde Manger',
        desc:el.querySelector('.pf-o-desc')?el.querySelector('.pf-o-desc').value.trim():'',
        upcharge:parseFloat(el.querySelector('.pf-o-up').value)||0,
        pairing:el.querySelector('.pf-o-pairing')?el.querySelector('.pf-o-pairing').value:'',
        photoUrl:el.querySelector('.pf-o-photo')?el.querySelector('.pf-o-photo').value.trim():'',
        allergens:allergenRaw.split(',').map(function(s){return s.trim();}).filter(Boolean),
        cookNote:el.querySelector('.pf-o-note')?el.querySelector('.pf-o-note').value.trim():'',
        chooseCount:prev.chooseCount||0,
        scoops:prev.scoops||null,
        dietary:prev.dietary||[],
        cookTime:prev.cookTime||0,
        i18n:prev.i18n||{},
        order:i
      });
    });

    /* Also rebuild legacy courses format for POS/iPad/Kitchen compatibility */
    pf.courses.forEach(function(c){
      c.options=pf.dishes.filter(function(d){return d.course===c.label;}).sort(function(a,b){return a.order-b.order;}).map(function(d){
        return {
          id:d.id, name:d.name, desc:d.desc, station:d.station, upcharge:d.upcharge, pairing:d.pairing, photoUrl:d.photoUrl,
          allergens:d.allergens||[], cookNote:d.cookNote||'', chooseCount:d.chooseCount||0, scoops:d.scoops||null,
          dietary:d.dietary||[], cookTime:d.cookTime||0, i18n:d.i18n||{}
        };
      });
    });
    pf.courseGroups=pf.courses.map(function(c){
      return {label:c.label, choose:c.mode==='choose'||c.mode==='later'?1:0, mode:c.mode, fireEach:!!c.fireEach, fireAfter:c.fireAfter||'', options:c.options};
    });
    pf.welcomeFireEach=pf.courses.some(function(c){return c.mode==='auto';});
    pf.dessertAfter='main';

    if(isNew) STATE.prixFixeMenus.push(pf);
    var cloudSave=savePrixFixeMenus();
    if(cloudSave && typeof cloudSave.then==='function'){
      cloudSave.then(function(ok){
        if(ok) toast('Prix fixe menu saved to cloud','success');
        else toast('Saved on this device only — cloud save failed','error');
        render();
      });
    } else {
      toast('Prix fixe menu saved locally','success');
      render();
    }
  }, function(){
    /* Bind add section */
    $('pf-add-section').addEventListener('click', function(){
      var container=$('pf-sections');
      var row=document.createElement('div');
      row.className='pf-sec-row';
      row.setAttribute('data-sec-id',uid('pfc'));
      var idx=container.querySelectorAll('.pf-sec-row').length;
      row.innerHTML='<div class="pf-sec-order">'+
        '<button type="button" onclick="pfSecMove(this,-1)" title="Move up">▲</button>'+
        '<button type="button" onclick="pfSecMove(this,1)" title="Move down">▼</button>'+
      '</div>'+
      '<span style="font-size:12px;color:var(--text-dim);min-width:20px;text-align:center;">'+(idx+1)+'</span>'+
      '<input class="input pf-sec-name" value="" placeholder="Section name (e.g. Appetizer, Aperitivo)">'+
      '<select class="input pf-sec-mode" title="How this course is ordered and fired">'+opts(['choose','auto','entremets','later'],'choose')+'</select>'+
      '<button type="button" class="btn btn-danger btn-sm" onclick="pfDelSection(this)" style="padding:4px 8px;font-size:11px;">✕</button>';
      container.appendChild(row);
      pfRefreshCategoryDropdowns();
    });
    /* Bind add dish */
    $('pf-add-dish').addEventListener('click', function(){
      pfAddDish();
    });
    /* Bind preview */
    $('pf-preview-btn').addEventListener('click', function(){
      pfUpdatePreview();
    });
  }, id?'<button class="btn btn-danger" onclick="deletePrixFixeMenu(\''+id+'\')">Delete</button>':'');
}

/* Add a new dish row */
function pfAddDish(){
  var container=$('pf-dishes');
  var row=document.createElement('div');
  row.className='pf-opt-row';
  row.setAttribute('data-dish-id',uid('pfd'));
  /* Get current sections for dropdown */
  var secNames=[];
  document.querySelectorAll('.pf-sec-name').forEach(function(el){var v=el.value.trim();if(v)secNames.push(v);});
  var courseOpts=secNames.map(function(s){return '<option value="'+esc(s)+'">'+esc(s)+'</option>';}).join('');
  if(!courseOpts) courseOpts='<option value="">— add a section first —</option>';
  var glassWines=(STATE.wines||[]).map(function(w){ return w.name+' ('+w.varietal+', $'+(w.glassPrice||12)+'/glass)'; });
  var wineOpts='<option value="">— Select Wine Pairing (Manual or AI) —</option>'+glassWines.map(function(w){ return '<option value="'+esc(w)+'">'+esc(w)+'</option>'; }).join('');
  var stationOpts=opts(['Garde Manger','Grill','Sauté','Pastry','Bar'],'Garde Manger');
  row.innerHTML='<button class="btn btn-danger btn-sm btn-del-opt" type="button" onclick="pfDelOpt(this)">✕</button>'+
    '<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;">'+
      '<div class="pf-dish-order">'+
        '<button type="button" onclick="pfDishMove(this,-1)" title="Move up">▲</button>'+
        '<button type="button" onclick="pfDishMove(this,1)" title="Move down">▼</button>'+
      '</div>'+
      '<select class="pf-o-category" onchange="pfUpdatePreview()" title="Assign dish course">'+courseOpts+'</select>'+
      '<select class="input pf-o-station" title="Kitchen station routing">'+stationOpts+'</select>'+
    '</div>'+
    '<div class="pf-opt-fields">'+
      '<input class="input pf-o-name" placeholder="Dish name (e.g. Seared Scallops)" value="">'+
      '<input class="input pf-o-up" type="number" step="0.01" placeholder="+$0 Extra Charge" value="0" title="Extra charge on top of base prix fixe price">'+
    '</div>'+
    '<label style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;">Description</label>'+
    '<textarea class="input pf-o-desc" placeholder="Describe ingredients, preparation, and flavor profile for guests..."></textarea>'+
    '<label style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;margin-top:6px;">Allergens (comma separated)</label>'+
    '<input class="input pf-o-allergens" placeholder="Fish, Gluten, Dairy, Tree Nut, Shellfish, Egg" value="">'+
    '<input class="input pf-o-note" placeholder="Kitchen note (e.g. Allow 12 minutes)" value="" style="margin-top:6px;">'+
    '<div style="margin-top:8px;">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">'+
        '<label style="font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.4px;">Wine Pairing (Glass)</label>'+
        '<button type="button" class="btn btn-ghost btn-sm" onclick="aiSuggestWinePairing(this)" style="padding:2px 8px;font-size:11px;">✨ AI Suggest Pairing</button>'+
      '</div>'+
      '<select class="input pf-o-pairing">'+wineOpts+'</select>'+
    '</div>'+
    '<div class="pf-opt-photo-row" style="margin-top:8px;">'+
      '<input class="input pf-o-photo" placeholder="Photo URL" value="" style="flex:1;" oninput="showPhotoPreview(this,this.value)">'+
      '<button type="button" class="btn btn-gold btn-sm" onclick="uploadPhoto(this.previousElementSibling)" style="padding:6px 10px;font-size:12px;">📷 Upload</button>'+
    '</div>';
  container.appendChild(row);
}

/* Move dish up/down */
function pfDishMove(btn, dir){
  var row=btn.closest('.pf-opt-row');
  var container=row.parentElement;
  var rows=Array.from(container.querySelectorAll('.pf-opt-row'));
  var idx=rows.indexOf(row);
  var target=idx+dir;
  if(target<0||target>=rows.length) return;
  if(dir===-1) container.insertBefore(row,rows[target]);
  else container.insertBefore(rows[target],row);
}

/* Move section up/down */
function pfSecMove(btn, dir){
  var row=btn.closest('.pf-sec-row');
  var container=row.parentElement;
  var rows=Array.from(container.querySelectorAll('.pf-sec-row'));
  var idx=rows.indexOf(row);
  var target=idx+dir;
  if(target<0||target>=rows.length) return;
  if(dir===-1) container.insertBefore(row,rows[target]);
  else container.insertBefore(rows[target],row);
  /* Update numbering */
  container.querySelectorAll('.pf-sec-row').forEach(function(r,i){
    r.querySelector('span').textContent=(i+1);
  });
}

/* Delete section */
function pfDelSection(btn){
  btn.closest('.pf-sec-row').remove();
  pfRefreshCategoryDropdowns();
  /* Renumber */
  document.querySelectorAll('#pf-sections .pf-sec-row').forEach(function(r,i){
    r.querySelector('span').textContent=(i+1);
  });
}

/* Refresh all category dropdowns when sections change */
function pfRefreshCategoryDropdowns(){
  var secNames=[];
  document.querySelectorAll('.pf-sec-name').forEach(function(el){var v=el.value.trim();if(v)secNames.push(v);});
  document.querySelectorAll('.pf-o-category').forEach(function(sel){
    var cur=sel.value;
    sel.innerHTML=secNames.map(function(s){return '<option value="'+esc(s)+'"'+(s===cur?' selected':'')+'>'+esc(s)+'</option>';}).join('');
    if(!secNames.length) sel.innerHTML='<option value="">— add a section first —</option>';
  });
}

/* Live preview */
function pfUpdatePreview(){
  var area=$('pf-preview-area');
  if(!area) return;
  var menuName=$('pf-name')?$('pf-name').value.trim():'Prix Fixe';
  var subtitle=$('pf-sub')?$('pf-sub').value.trim():'';
  var price=$('pf-price')?$('pf-price').value:'';
  /* Gather sections in order */
  var sections=[];
  document.querySelectorAll('#pf-sections .pf-sec-row').forEach(function(r,i){
    var label=r.querySelector('.pf-sec-name').value.trim();
    if(label) sections.push({label:label, order:i, dishes:[]});
  });
  /* Gather dishes */
  document.querySelectorAll('#pf-dishes .pf-opt-row').forEach(function(el,i){
    var name=el.querySelector('.pf-o-name').value.trim();
    if(!name) return;
    var cat=el.querySelector('.pf-o-category').value;
    var up=parseFloat(el.querySelector('.pf-o-up').value)||0;
    var sec=sections.find(function(s){return s.label===cat;});
    if(sec) sec.dishes.push({name:name, upcharge:up});
  });
  /* Render preview */
  var html='<div class="pf-preview-panel">';
  html+='<h3>'+esc(menuName||'Prix Fixe')+'</h3>';
  if(subtitle) html+='<div class="pf-prev-sub">'+esc(subtitle)+'</div>';
  if(price) html+='<div style="font-size:13px;color:var(--gold);margin-bottom:12px;">$'+parseFloat(price).toFixed(2)+' per person</div>';
  sections.forEach(function(sec){
    html+='<div class="pf-prev-section">';
    var modeEl=document.querySelectorAll('#pf-sections .pf-sec-row')[sec.order];
    var mode=modeEl&&modeEl.querySelector('.pf-sec-mode')?modeEl.querySelector('.pf-sec-mode').value:'choose';
    var modeLabel=mode==='auto'?'served automatically, fire one by one':mode==='entremets'?'entremets before dessert':mode==='later'?'ordered after main':'choose 1';
    html+='<h4>'+esc(sec.label)+' — '+modeLabel+'</h4>';
    if(!sec.dishes.length) html+='<div style="color:var(--text-faint);font-size:12px;font-style:italic;">No dishes assigned</div>';
    sec.dishes.forEach(function(d){
      html+='<div class="pf-prev-item"><span class="name">'+esc(d.name)+'</span>';
      if(d.upcharge>0) html+='<span class="up">+$'+d.upcharge.toFixed(0)+'</span>';
      html+='</div>';
    });
    html+='</div>';
  });
  html+='</div>';
  area.innerHTML=html;
}

function pfDelOpt(btn){ btn.closest('.pf-opt-row').remove(); }
function pfDelCourse(btn){ btn.closest('.pf-course-block').remove(); }
function deletePrixFixeMenu(id){
  if(!confirm('Delete this prix fixe menu?')) return;
  STATE.prixFixeMenus=STATE.prixFixeMenus.filter(function(x){return x.id!==id;});
  savePrixFixeMenus(); closeModal(); render(); toast('Prix fixe menu deleted','success');
}


/* ============================================================
   SCAN ALL ALLERGENS — runs AI/rules on all menu items at once
   ============================================================ */
function scanAllAllergens(){
  var items = STATE.menuItems.filter(function(it){ return !it.verified; });
  if(!items.length){ toast('All items are already chef-verified!','success'); return; }
  toast('Scanning '+items.length+' unverified items...','info');
  var done=0;
  items.forEach(function(it){
    var text = it.name+' — '+(it.ingredients||'')+' '+(it.desc||'');
    analyzeDietAI(text).then(function(ai){
      var res = ai || analyzeDietRules(text);
      it.allergens = res.allergens || [];
      it.diet = res.diet || [];
      done++;
      if(done>=items.length){
        saveMenu();
        toast('Allergen scan complete! '+done+' items analyzed.','success');
        render();
      }
    });
  });
}

/* AI Wine Pairing Suggester for Prix Fixe Dishes (with manual override) */
function aiSuggestWinePairing(btn){
  var row = btn.closest('.pf-opt-row');
  var name = (row.querySelector('.pf-o-name').value||'').toLowerCase();
  var desc = (row.querySelector('.pf-o-desc').value||'').toLowerCase();
  var category = (row.querySelector('.pf-o-category').value||'').toLowerCase();
  var select = row.querySelector('.pf-o-pairing');
  if(!select) return;

  var wines = STATE.wines || [];
  if(!wines.length){ toast('No wines available in inventory','error'); return; }

  /* Intelligent wine matching based on ingredient/dish profile */
  var bestWine = wines[0];
  var combined = name + ' ' + desc;
  if(combined.indexOf('chocolate')>=0 || combined.indexOf('dessert')>=0 || category.indexOf('dessert')>=0){
    bestWine = wines.filter(function(w){return (w.varietal||'').toLowerCase().indexOf('port')>=0 || (w.varietal||'').toLowerCase().indexOf('chardonnay')>=0;})[0] || wines[0];
  } else if(combined.indexOf('steak')>=0 || combined.indexOf('beef')>=0 || combined.indexOf('lamb')>=0 || combined.indexOf('ribeye')>=0 || combined.indexOf('duck')>=0){
    bestWine = wines.filter(function(w){return (w.varietal||'').toLowerCase().indexOf('malbec')>=0 || (w.varietal||'').toLowerCase().indexOf('cabernet')>=0;})[0] || wines[0];
  } else if(combined.indexOf('fish')>=0 || combined.indexOf('salmon')>=0 || combined.indexOf('ceviche')>=0 || combined.indexOf('scallop')>=0 || combined.indexOf('lobster')>=0){
    bestWine = wines.filter(function(w){return (w.varietal||'').toLowerCase().indexOf('chardonnay')>=0 || (w.varietal||'').toLowerCase().indexOf('sauvignon')>=0;})[0] || wines[1] || wines[0];
  }

  for(var i=0; i<select.options.length; i++){
    if(select.options[i].value.indexOf(bestWine.name)>=0){
      select.selectedIndex = i;
      toast('✨ AI Suggested Pairing: '+bestWine.name+' (Manager can override anytime)','success');
      return;
    }
  }
  toast('✨ AI Suggested: '+bestWine.name,'success');
}
