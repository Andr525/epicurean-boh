function drawStationNameTags(canvas){
  curObjs().forEach(function(o){
    if(!o || o.type!=='waiterstation') return;
    var tag=el('div',{class:'ws-name-tag','data-station':o.id,title:FLOOR.mode==='edit'?'Drag to place this name inside the station':''},esc(stationTagText(o)));
    var tx=(o.tagX!=null)?+o.tagX:8;
    var ty=(o.tagY!=null)?+o.tagY:6;
    tag.style.left=(o.x+tx)+'px';
    tag.style.top=(o.y+ty)+'px';
    canvas.appendChild(tag);
    var maxX=Math.max(0,(o.w||220)-Math.max(tag.offsetWidth,24));
    var maxY=Math.max(0,(o.h||180)-Math.max(tag.offsetHeight,18));
    tx=Math.max(0,Math.min(maxX, tx));
    ty=Math.max(0,Math.min(maxY, ty));
    tag.style.left=(o.x+tx)+'px';
    tag.style.top=(o.y+ty)+'px';
    if(FLOOR.mode==='edit') addTagDrag(tag,o);
  });
}
function addTagDrag(tag,o){
  var sx,sy,ox,oy,moved,dragging=false;
  function down(e){
    e.preventDefault(); e.stopPropagation();
    dragging=true; moved=false;
    var p=pt(e); sx=p.x; sy=p.y;
    ox=(o.tagX!=null)?+o.tagX:8; oy=(o.tagY!=null)?+o.tagY:6;
    document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
    document.addEventListener('touchmove',move,{passive:false}); document.addEventListener('touchend',up);
  }
  function move(e){
    if(!dragging)return; e.preventDefault(); e.stopPropagation();
    var p=pt(e); var dx=p.x-sx, dy=p.y-sy;
    if(Math.abs(dx)+Math.abs(dy)>2) moved=true;
    var maxX=Math.max(0,(o.w||220)-Math.max(tag.offsetWidth,24));
    var maxY=Math.max(0,(o.h||180)-Math.max(tag.offsetHeight,18));
    o.tagX=Math.round(Math.max(0,Math.min(maxX, ox+dx)));
    o.tagY=Math.round(Math.max(0,Math.min(maxY, oy+dy)));
    tag.style.left=(o.x+o.tagX)+'px';
    tag.style.top=(o.y+o.tagY)+'px';
  }
  function up(){
    if(!dragging)return; dragging=false;
    document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up);
    document.removeEventListener('touchmove',move); document.removeEventListener('touchend',up);
    if(moved){ saveFloor(true); toast('Name tag placed','success'); }
    else { FLOOR.sel=o.id; renderFloor(); }
  }
  tag.addEventListener('mousedown',down);
  tag.addEventListener('touchstart',down,{passive:false});
}

function pt(e){ var t=e.touches?e.touches[0]:e; return {x:t.clientX,y:t.clientY}; }
function makeDraggable(node,o){
  var sx,sy,ox,oy,moved,dragging=false;
  function down(e){ if(e.target.classList.contains('resize-handle')||e.target.classList.contains('rotate-handle')||e.target.classList.contains('vertex-handle'))return; e.preventDefault(); dragging=true;moved=false; var p=pt(e); sx=p.x;sy=p.y;ox=o.x;oy=o.y; node.classList.add('dragging');
    document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',up); }
  function move(e){ if(!dragging)return; e.preventDefault(); var p=pt(e); var dx=p.x-sx,dy=p.y-sy; if(Math.abs(dx)+Math.abs(dy)>3)moved=true;
    o.x=Math.max(0,Math.round((ox+dx)/10)*10); o.y=Math.max(0,Math.round((oy+dy)/10)*10);
    node.style.left=o.x+'px'; node.style.top=o.y+'px'; }
  function up(){ if(!dragging)return; dragging=false; node.classList.remove('dragging');
    document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);document.removeEventListener('touchmove',move);document.removeEventListener('touchend',up);
    if(moved){ if(wsHasPoly(o)){ var dx=o.x-ox, dy=o.y-oy; o.points=o.points.map(function(p){ return {x:p.x+dx,y:p.y+dy}; }); } saveFloor(); renderFloor(); } else { FLOOR.sel=o.id; renderFloor(); } }
  node.addEventListener('mousedown',down); node.addEventListener('touchstart',down,{passive:false});
}
function addResize(handle,node,o){
  var sx,sy,ow,oh,rz=false;
  function down(e){ e.preventDefault(); e.stopPropagation(); rz=true; var p=pt(e); sx=p.x;sy=p.y;ow=o.w;oh=o.h;
    document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',up); }
  function move(e){ if(!rz)return; e.preventDefault(); var p=pt(e); var dx=p.x-sx,dy=p.y-sy;
    o.w=Math.max(24,Math.round((ow+dx)/10)*10); o.h=Math.max(24,Math.round((oh+dy)/10)*10);
    node.style.width=o.w+'px'; node.style.height=o.h+'px'; }
  function up(){ if(!rz)return; rz=false;
    document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);document.removeEventListener('touchmove',move);document.removeEventListener('touchend',up);
    saveFloor(); renderInspector(); }
  handle.addEventListener('mousedown',down); handle.addEventListener('touchstart',down,{passive:false});
}
/* Req 4: free 360° rotation via a drag handle. Angle is measured from the
   object's on-screen center to the pointer; the handle sits above the object
   (local up = 0°), so +90° maps pointer-right to 0. Rotation is visual only
   (CSS transform), so click/drag hit-testing still maps to the rotated element. */
function addRotate(handle,node,o){
  var rot=false;
  function center(){ var r=node.getBoundingClientRect(); return {x:r.left+r.width/2, y:r.top+r.height/2}; }
  function down(e){ e.preventDefault(); e.stopPropagation(); rot=true;
    document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',up); }
  function move(e){ if(!rot)return; e.preventDefault(); var p=pt(e); var c=center();
    var deg=Math.atan2(p.y-c.y,p.x-c.x)*180/Math.PI+90; deg=Math.round((deg%360+360)%360);
    o.rot=deg; node.style.transform='rotate('+deg+'deg)'; }
  function up(){ if(!rot)return; rot=false;
    document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);document.removeEventListener('touchmove',move);document.removeEventListener('touchend',up);
    saveFloor(); renderInspector(); }
  handle.addEventListener('mousedown',down); handle.addEventListener('touchstart',down,{passive:false});
}
/* Live preview while dragging the rotation slider — updates transform + the
   numeric field without a full save/re-render on every input event. */
function liveRot(id,val){ var o=findObj(id); if(!o)return; o.rot=((parseInt(val,10)||0)%360+360)%360;
  var node=document.querySelector('.floor-obj[data-id="'+id+'"]'); if(node)node.style.transform='rotate('+o.rot+'deg)';
  var num=document.getElementById('rot-num-'+id); if(num)num.value=o.rot; }

/* Req 5: pointer position in floor-canvas coordinates (same space as object x/y). */
function canvasPt(e){ var c=$('floor-canvas'); if(!c)return {x:0,y:0}; var r=c.getBoundingClientRect(); var t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left, y:t.clientY-r.top}; }
/* Live-update a station's polygon + vertex handles during a vertex drag without a
   full re-render (box origin is only recalculated on drop, avoiding jitter). */
function updateWsPolyLive(o){
  var node=document.querySelector('.floor-obj[data-id="'+o.id+'"]'); if(!node)return;
  var poly=node.querySelector('.ws-poly polygon');
  if(poly) poly.setAttribute('points', o.points.map(function(p){ return (p.x-o.x)+','+(p.y-o.y); }).join(' '));
  o.points.forEach(function(p,i){ var vh=node.querySelector('.vertex-handle[data-i="'+i+'"]'); if(vh){ vh.style.left=(p.x-o.x)+'px'; vh.style.top=(p.y-o.y)+'px'; } });
}
function addVertexDrag(handle,node,o,idx){
  var vt=false,moved=false;
  function down(e){ e.preventDefault(); e.stopPropagation(); vt=true; moved=false; if(!wsHasPoly(o)) o.points=wsRectPoints(o);
    document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',up); }
  function move(e){ if(!vt)return; e.preventDefault(); moved=true; var p=canvasPt(e);
    o.points[idx]={x:Math.max(0,Math.round(p.x/10)*10), y:Math.max(0,Math.round(p.y/10)*10)};
    updateWsPolyLive(o); }
  /* Only persist/re-render on an actual drag. A click without movement leaves the
     handle in place so a following click can register as a dblclick (remove). */
  function up(){ if(!vt)return; vt=false;
    document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);document.removeEventListener('touchmove',move);document.removeEventListener('touchend',up);
    if(moved){ wsRecalcBox(o); saveFloor(); renderFloor(); } }
  handle.addEventListener('mousedown',down); handle.addEventListener('touchstart',down,{passive:false});
  handle.addEventListener('dblclick',function(e){ e.preventDefault(); e.stopPropagation(); removeStationPoint(o.id,idx); });
}
function startEditPts(id){ var o=findObj(id); if(!o)return; if(!wsHasPoly(o)) o.points=wsRectPoints(o); FLOOR.editPts=id; FLOOR.sel=id; saveFloor(true); renderFloor(); }
function stopEditPts(){ FLOOR.editPts=null; renderFloor(); }
function addStationPoint(id){ var o=findObj(id); if(!o)return; if(!wsHasPoly(o)) o.points=wsRectPoints(o);
  var pts=o.points, best=-1, bi=0;
  for(var i=0;i<pts.length;i++){ var a=pts[i],b=pts[(i+1)%pts.length]; var d=Math.hypot(b.x-a.x,b.y-a.y); if(d>best){best=d;bi=i;} }
  var a=pts[bi],b=pts[(bi+1)%pts.length];
  pts.splice(bi+1,0,{x:Math.round((a.x+b.x)/2), y:Math.round((a.y+b.y)/2)});
  wsRecalcBox(o); saveFloor(true); renderFloor(); }
function removeStationPoint(id,idx){ var o=findObj(id); if(!o||!wsHasPoly(o))return;
  if(o.points.length<=3){ toast('A station needs at least 3 points','error'); return; }
  o.points.splice(idx,1); wsRecalcBox(o); saveFloor(true); renderFloor(); }

var DEMO_TABLE_TURNS={
  '22':[
    {time:'5:00 PM', name:'Harrison Chen', party:6, vip:false, notes:'Anniversary · prefer window'},
    {time:'7:00 PM', name:'UK Prime Minister', party:4, vip:true, notes:'Security detail · quiet corner'}

function ensureDemoTurns(){
  var used={};
  allTables().forEach(function(o){
    if(!o || o.type==='couch') return;
    if(Array.isArray(o.turns)&&o.turns.length) return;
    var key=String(o.num);
    if(DEMO_TABLE_TURNS[key] && !used[key]){ o._demoTurns=DEMO_TABLE_TURNS[key]; used[key]=1; }
  });
  var leftover=Object.keys(DEMO_TABLE_TURNS).filter(function(k){ return !used[k]; });
  allTables().forEach(function(o){
    if(!leftover.length) return;
    if(!o || o.type==='couch') return;
    if((Array.isArray(o.turns)&&o.turns.length) || o._demoTurns) return;
    var k=leftover.shift();
    o._demoTurns=DEMO_TABLE_TURNS[k];
  });
}
function tableTurns(o){
  if(o && Array.isArray(o.turns) && o.turns.length) return o.turns;

  if(!s.rates||!s.rates.length) return s.wage||0;
  var r=s.rates.slice().sort(function(a,b){return b.effective-a.effective;})[0];
  return r?r.rate:(s.wage||0);
}
function primaryJob(s){ return (s.jobs&&s.jobs[0])?s.jobs[0].code:roleFromCode(s.code).label; }
function empIndex(s){ // 1-based index in roster
  return STATE.staff.map(function(x){return x.id;}).indexOf(s.id)+1;
}
function fmtDay(ts){ return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function accessColor(a){ return {'No Access':'#8892a6','Order Only':'#9BC4E2','POS':'#5FB48A','Manager':'#E07A6B','Full':'#C9A84C'}[a]||'#8892a6'; }

function empTab(t){ EMP.tab=t; render(); }

/* ============================================================
   EMPLOYEE DETAIL (tabbed record)
   ============================================================ */
function PAGE_empDetail(s){
  var role=roleFromCode(s.code);
  var initials=(s.name||'E').split(' ').map(function(w){return w[0];}).slice(0,2).join('').toUpperCase();
  var tabs=[
    ['profile','Profile & Contact'],['jobs','Jobcodes & Access'],['rates','Pay Rates'],
    ['dependents','Dependents'],['notes','Notes'],['reviews','Monthly Reviews'],
    ['sales','Sales'],['paycheck','Weekly Paycheck']
  ];
  var tabBar=tabs.map(function(t){ return '<div class="etab'+(EMP.tab===t[0]?' active':'')+'" onclick="empTab(\''+t[0]+'\')">'+t[1]+'</div>'; }).join('');

    '<div class="emp-avatar" style="background:'+role.color+'22;color:'+role.color+'">'+initials+'</div>'+
    '<div class="emp-head-info"><div class="emp-name serif">'+esc(s.name)+'</div>'+
      '<div class="emp-meta">Employee #'+empIndex(s)+' · '+esc(primaryJob(s))+' · Code '+esc((s.code||'')[0]||'')+'••• · $'+currentRate(s).toFixed(2)+'/hr</div></div>'+
    '<div class="emp-head-actions">'+
      '<button class="btn btn-ghost btn-sm" onclick="closeEmp()">← Roster</button> '+

}

function saveProfile(id){
  var s=empById(id); if(!s)return;
  var name=($('pf-name').value||'').trim(), code=($('pf-code').value||'').trim();
  if(!name){toast('Enter a name','error');return;}
  if(!/^\d{4}$/.test(code)){toast('Code must be 4 digits','error');return;}
  if(STATE.staff.some(function(x){return x.code===code&&x.id!==id;})){toast('That code is already used','error');return;}
  s.name=name; s.code=code; s.status=$('pf-status').value;
  var hd=$('pf-hired').value; if(hd)s.hired=new Date(hd).getTime();
  s.contact={ address:$('pf-address').value.trim(), city:$('pf-city').value.trim(), state:$('pf-state').value.trim(), zip:$('pf-zip').value.trim(), phone:$('pf-phone').value.trim(), email:$('pf-email').value.trim(), emName:$('pf-emname').value.trim(), emPhone:$('pf-emphone').value.trim() };
  persistStaff(); EMP.openId=null; render(); toast('Profile saved','success');
}

function jobSelect(id,val){ return '<select class="input" id="'+id+'">'+JOBCODES.map(function(j){return '<option'+(j===val?' selected':'')+'>'+j+'</option>';}).join('')+'</select>'; }
function accessSelect(id,val){ return '<select class="input" id="'+id+'">'+ACCESS_LEVELS.map(function(a){return '<option'+(a===val?' selected':'')+'>'+a+'</option>';}).join('')+'</select>'; }
function addJob(id){ var s=empById(id); if(!s)return; s.jobs=s.jobs||[]; s.jobs.push({code:JOBCODES[0],access:'No Access',rate:currentRate(s)||15}); persistStaff(); render(); }
function removeJob(id,i){ var s=empById(id); if(!s)return; s.jobs.splice(i,1); persistStaff(); render(); }
function saveJobs(id){
  var s=empById(id); if(!s)return;
  s.jobs=(s.jobs||[]).map(function(j,i){ return { code:$('job-code-'+i).value, access:$('job-acc-'+i).value, rate:parseFloat($('job-rate-'+i).value)||0 }; });
  s.perms=collectPermsInline(s);
  persistStaff(); EMP.openId=null; render(); toast('Jobcodes saved','success');
}
function managerPermsBlock(s){
  var isMgr=(s.code||'')[0]==='5' || (s.jobs||[]).some(function(j){return j.access==='Manager'||j.access==='Full';});
  if(!isMgr)return '';
  var permHTML=PERMISSIONS.map(function(p){ var on=s.perms&&s.perms[p.key]; return '<span class="chip perm-chip'+(on?' on':'')+'" data-perm="'+p.key+'" onclick="this.classList.toggle(\'on\')">'+p.label+'</span>'; }).join('');
  return '<div class="section-label">Manager Permissions</div><div class="chip-row">'+permHTML+'</div>'+

function collectPermsInline(s){
  var isMgr=(s.code||'')[0]==='5' || (s.jobs||[]).some(function(j){return j.access==='Manager'||j.access==='Full';});
  if(!isMgr)return null;
  var perms={}; document.querySelectorAll('.perm-chip').forEach(function(c){ perms[c.getAttribute('data-perm')]=c.classList.contains('on'); }); return perms;
}

function addRate(id){

/* ---- Tab: Monthly Reviews ---- */
function tabReviews(s){
  var revs=(s.reviews||[]).slice().sort(function(a,b){return b.month.localeCompare(a.month);});
  var list=revs.map(function(r){
    var cats=REVIEW_CATS.map(function(c){ return '<span class="pill" style="background:#5FB48A22;color:#5FB48A;margin:2px">'+esc(c)+': '+(r.scores[c]||'-')+'</span>'; }).join('');
    return '<div class="note-item"><div class="note-meta">'+esc(r.month)+' · reviewed by '+esc(r.by||'Manager')+' · avg '+r.avg+'/5</div><div style="margin:6px 0">'+cats+'</div>'+(r.comment?'<div class="note-text">'+esc(r.comment)+'</div>':'')+'</div>';
  }).join('')||'<div class="empty">No reviews yet.</div>';

    return '<div class="field"><label>'+c+' (1-5)</label><select class="input" id="rv-'+c.replace(/\s/g,'')+'">'+[5,4,3,2,1].map(function(n){return '<option value="'+n+'"'+(n===4?' selected':'')+'>'+n+'</option>';}).join('')+'</select></div>';
  }).join('');
  return '<div class="mini-note" style="margin-top:0">Record a monthly review to track and discuss performance. The trend chart shows their overall score over time.</div>'+

    '<div class="form-grid cols-2"><div class="field"><label>Month</label><input class="input" id="rv-month" type="month" value="'+new Date().toISOString().slice(0,7)+'"></div></div>'+
    '<div class="form-grid cols-3">'+catInputs+'</div>'+

    '<div class="notes-list">'+list+'</div>';
}
function addReview(id){
  var s=empById(id); if(!s)return;
  var month=$('rv-month').value; if(!month){toast('Pick a month','error');return;}
  var scores={}, sum=0; REVIEW_CATS.forEach(function(c){ var v=parseInt($('rv-'+c.replace(/\s/g,'')).value)||0; scores[c]=v; sum+=v; });
  var avg=(sum/REVIEW_CATS.length).toFixed(1);
  s.reviews=s.reviews||[];
  s.reviews=s.reviews.filter(function(r){return r.month!==month;}); // one review per month
  s.reviews.push({month:month,scores:scores,avg:avg,comment:($('rv-comment').value||'').trim(),by:(SESSION.user&&SESSION.user.name)||'Manager',ts:Date.now()});
  persistStaff(); render(); toast('Review saved','success');
}
function drawReviewChart(s){
  if(typeof Chart==='undefined')return; var cv=$('reviewChart'); if(!cv)return;
  var revs=(s.reviews||[]).slice().sort(function(a,b){return a.month.localeCompare(b.month);});
  new Chart(cv.getContext('2d'),{type:'line',data:{labels:revs.map(function(r){return r.month;}),datasets:[{label:'Overall avg /5',data:revs.map(function(r){return r.avg;}),borderColor:'#C9A84C',backgroundColor:'#C9A84C33',tension:.3,fill:true,pointRadius:4}]},options:chartOpts(5)});
}

  }).join('');

    '<div class="charts-2">'+
      '<div class="chart-wrap" style="height:260px"><canvas id="salesBar"></canvas></div>'+
      '<div class="chart-wrap" style="height:260px"><canvas id="salesMix"></canvas></div>'+
    '</div>'+
    '<div class="mini-note">'+(hasData?'':'Showing empty scaffolding. ')+'These charts populate from live POS data. You will be able to open this screen with the employee and review their daily, monthly, and annual productivity side by side.</div>';

var _charts=[];
function destroyCharts(){ _charts.forEach(function(c){try{c.destroy();}catch(e){}}); _charts=[]; }
function chartOpts(max){ return {responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#c7cfda'}}},scales:{x:{ticks:{color:'#8892a6'},grid:{color:'#ffffff10'}},y:{beginAtZero:true,suggestedMax:max,ticks:{color:'#8892a6'},grid:{color:'#ffffff10'}}}}; }
function drawSalesCharts(s){
  if(typeof Chart==='undefined')return; destroyCharts();
  var range=($('sales-range')&&$('sales-range').value)||'monthly';
  var labels = range==='daily' ? ['Mon','Tue','Wed','Thu','Fri','Sat','Sun']
             : range==='annual' ? ['2023','2024','2025','2026']

  var barCv=$('salesBar');

/* ---- Tab: Weekly Paycheck ---- */
function hoursThisWeek(staffId){
  // pair in/out punches within the current week; fallback 0
  var now=new Date(); var day=now.getDay(); var monday=new Date(now); monday.setHours(0,0,0,0); monday.setDate(now.getDate()-((day+6)%7));
  var start=monday.getTime();
  var punches=STATE.punches.filter(function(p){return p.staffId===staffId && p.ts>=start && (p.type==='in'||p.type==='out');}).sort(function(a,b){return a.ts-b.ts;});
  var total=0, open=null;
  punches.forEach(function(p){ if(p.type==='in')open=p.ts; else if(p.type==='out'&&open){ total+=(p.ts-open); open=null; } });
  return total/3600000; // hours
}
function tabPaycheck(s){
  var ps=payrollSettings();
  var rate=currentRate(s);
  var hrs=hoursThisWeek(s.id);
  var reg=Math.min(hrs,ps.otThreshold), ot=Math.max(0,hrs-ps.otThreshold);
  return '<div class="mini-note" style="margin-top:0">Weekly paycheck estimate from clocked hours × current rate. Deduction percentages are set in <span class="link" onclick="go(\'payroll_settings\')">Payroll Settings</span> and can be changed anytime as rates change. This is an estimate for planning, not an official tax filing.</div>'+
    '<div class="form-grid cols-3">'+
      '<div class="field"><label>Regular Hours</label><input class="input" id="pc-reg" type="number" step="0.25" value="'+reg.toFixed(2)+'"></div>'+
      '<div class="field"><label>Overtime Hours (×'+ps.otMultiplier+')</label><input class="input" id="pc-ot" type="number" step="0.25" value="'+ot.toFixed(2)+'"></div>'+
      '<div class="field"><label>Pay Rate ($/hr)</label><input class="input" id="pc-rate" type="number" step="0.25" value="'+rate.toFixed(2)+'"></div>'+
    '</div>'+
    '<div class="form-grid cols-4">'+
      '<div class="field"><label>Federal %</label><input class="input" id="pc-fed" type="number" step="0.1" value="'+ps.federalPct+'"></div>'+
      '<div class="field"><label>State %</label><input class="input" id="pc-state" type="number" step="0.1" value="'+ps.statePct+'"></div>'+
      '<div class="field"><label>Social Security %</label><input class="input" id="pc-ss" type="number" step="0.01" value="'+ps.ssPct+'"></div>'+
      '<div class="field"><label>Medicare %</label><input class="input" id="pc-med" type="number" step="0.01" value="'+ps.medicarePct+'"></div>'+
    '</div>'+
    '<div class="form-grid cols-2">'+
      '<div class="field"><label>Other Deductions ($)</label><input class="input" id="pc-other" type="number" step="0.01" value="'+ps.otherAmt+'"></div>'+
      '<div class="field" style="display:flex;align-items:flex-end"><button class="btn btn-gold" style="width:100%" onclick="calcPay(\''+s.id+'\')">Calculate Paycheck</button></div>'+
    '</div>'+
    '<div id="pc-result" class="pay-stub"></div>';
}
function calcPay(id){
  var s=empById(id); if(!s)return;
  var reg=parseFloat($('pc-reg').value)||0, ot=parseFloat($('pc-ot').value)||0, rate=parseFloat($('pc-rate').value)||0;
  var ps=payrollSettings();
  var gross=reg*rate + ot*rate*ps.otMultiplier;
  var fed=gross*(parseFloat($('pc-fed').value)||0)/100;
  var st=gross*(parseFloat($('pc-state').value)||0)/100;
  var ss=gross*(parseFloat($('pc-ss').value)||0)/100;
  var med=gross*(parseFloat($('pc-med').value)||0)/100;
  var other=parseFloat($('pc-other').value)||0;
  var totalDed=fed+st+ss+med+other;
  var net=gross-totalDed;
  function row(l,v,neg){ return '<div class="stub-row"><span>'+l+'</span><span'+(neg?' style="color:var(--red)"':'')+'>'+(neg?'-':'')+'$'+Math.abs(v).toFixed(2)+'</span></div>'; }
  $('pc-result').innerHTML='<div class="stub-title serif">Weekly Pay Stub — '+esc(s.name)+'</div>'+
    row('Regular ('+reg.toFixed(2)+' h × $'+rate.toFixed(2)+')', reg*rate)+
    row('Overtime ('+ot.toFixed(2)+' h × $'+(rate*ps.otMultiplier).toFixed(2)+')', ot*rate*ps.otMultiplier)+
    '<div class="stub-row stub-sub"><span>Gross Pay</span><span>$'+gross.toFixed(2)+'</span></div>'+
    row('Federal Withholding',fed,true)+row('State Withholding',st,true)+row('Social Security',ss,true)+row('Medicare',med,true)+row('Other',other,true)+
    '<div class="stub-row stub-total"><span>Net Pay</span><span>$'+net.toFixed(2)+'</span></div>'+
    '<div class="mini-note">Hours pull automatically from clock punches for the current week; you can adjust any field before calculating. Estimate only.</div>';
}

/* ============================================================
   AI / RULE-BASED DIETARY & ALLERGEN ANALYSIS
   Works with no key (keyword rules). If an OpenAI key is saved,
   analyzeDietAI() upgrades to a real model call from the browser.
   Results are ALWAYS chef-verify-required before an item goes live.
   ============================================================ */
var ALLERGEN_KEYWORDS = {
  'Gluten':['wheat','flour','bread','pasta','breadcrumb','panko','barley','rye','malt','couscous','soy sauce','beer','cracker','crouton','tortilla','batter','roux'],
  'Dairy':['milk','butter','cream','cheese','parmesan','mozzarella','yogurt','ghee','béchamel','bechamel','buttermilk','custard','ice cream','queso','crème','creme'],
  'Egg':['egg','eggs','mayonnaise','mayo','aioli','meringue','custard','hollandaise','egg white','egg yolk'],
  'Peanut':['peanut','peanuts','groundnut','peanut butter','satay'],
  'Tree Nut':['almond','walnut','pecan','cashew','pistachio','hazelnut','macadamia','pine nut','praline','marzipan','nut'],
  'Shellfish':['shrimp','prawn','crab','lobster','crawfish','crayfish','langoustine','scallop','clam','mussel','oyster','shellfish'],
  'Fish':['fish','salmon','tuna','cod','bass','anchovy','sardine','trout','halibut','snapper','sea bass','fish sauce','worcestershire'],
  'Soy':['soy','soybean','tofu','edamame','soy sauce','tempeh','miso','tamari'],
  'Sesame':['sesame','tahini','sesame oil','za\'atar','hummus'],
  'Sulfites':['wine','vinegar','dried fruit','sulfite','sulphite']
};
var MEAT_WORDS = ['beef','pork','chicken','turkey','lamb','veal','bacon','ham','duck','sausage','prosciutto','fish','salmon','tuna','shrimp','crab','lobster','anchovy','gelatin','sea bass','cod','bass'];
var ANIMAL_WORDS = MEAT_WORDS.concat(['milk','butter','cream','cheese','egg','honey','yogurt','ghee','custard']);
var SUGAR_WORDS = ['sugar','honey','syrup','caramel','chocolate','candied','molasses','agave','fondant','glaze','sweetened','simple syrup'];

function analyzeDietRules(text){
  var t=(' '+(text||'').toLowerCase()+' ');
  var found=[];
  for(var a in ALLERGEN_KEYWORDS){
    var hit=ALLERGEN_KEYWORDS[a].some(function(k){ return t.indexOf(k)>-1; });
    if(hit)found.push(a);
  }
  var hasMeat=MEAT_WORDS.some(function(k){return t.indexOf(k)>-1;});
  var hasAnimal=ANIMAL_WORDS.some(function(k){return t.indexOf(k)>-1;});
  var hasSugar=SUGAR_WORDS.some(function(k){return t.indexOf(k)>-1;});
  var diet=[];
  if(found.indexOf('Gluten')===-1)diet.push('Gluten-Free');
  if(found.indexOf('Dairy')===-1)diet.push('Dairy-Free');
  if(!hasAnimal)diet.push('Vegan');
  if(!hasMeat)diet.push('Vegetarian');
  if(found.indexOf('Peanut')===-1&&found.indexOf('Tree Nut')===-1)diet.push('Nut-Free');
  if(found.indexOf('Shellfish')===-1)diet.push('Shellfish-Free');
  if(found.indexOf('Egg')===-1)diet.push('Egg-Free');
  if(found.indexOf('Soy')===-1)diet.push('Soy-Free');
  if(!hasSugar)diet.push('Sugar-Free / Diabetic');
  return {allergens:found, diet:diet, note:'Rule-based scan of ingredient keywords. Verify against actual prep and cross-contact.', source:'rules'};
}

/* Optional real-AI upgrade using the user's own key, stored only in browser. */
function analyzeDietAI(text){
  var key=aiKey();
  if(!key) return Promise.resolve(null);
  var sys='You are a food-safety assistant for a restaurant. Given a dish name and its ingredients, identify allergens and dietary flags. Respond ONLY with compact JSON.';
  var schema='Allowed allergens: '+ALLERGENS.join(', ')+'. Allowed diet flags: '+DIET_FLAGS.join(', ')+'.';
  var user='Dish + ingredients: "'+text+'". Return JSON: {"allergens":[...],"diet":[...],"note":"one short sentence"}. '+schema;
  return fetch('https://api.openai.com/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
    body:JSON.stringify({model:'gpt-4o-mini',temperature:0,messages:[{role:'system',content:sys},{role:'user',content:user}],response_format:{type:'json_object'}})
  }).then(function(r){ return r.json(); }).then(function(j){
    try{ var c=JSON.parse(j.choices[0].message.content); c.source='ai'; if(!c.note)c.note='AI analysis.'; return c; }catch(e){ return null; }
  }).catch(function(){ return null; });
}

function PAGE_menu(){
  return { title:'Food Menu', sub:STATE.menuItems.length+' items · '+STATE.menuCats.length+' categories', body:menuBody(), bind:null };
}
function menuBody(){
  var btns='<button class="btn btn-ghost btn-sm" onclick="openModifierManager()">Modifiers</button>'+
           '<button class="btn btn-ghost btn-sm" onclick="openAiSettings()">AI Settings</button>'+
           '<button class="btn btn-ghost btn-sm" onclick="openCatManager()">Manage Categories</button>'+
           '<button class="btn btn-gold btn-sm" onclick="publishMenusToFrontOfHouse()">Send to POS &amp; iPad</button>'+
           '<button class="btn btn-gold btn-sm" onclick="openItemEditor(null)">+ New Item</button>';
  var tabs='<div class="cat-tabs"><div class="cat-tab'+(MENU_CAT_FILTER==='all'?' active':'')+'" onclick="setMenuCat(\'all\')">All</div>';
  STATE.menuCats.forEach(function(c){
    tabs+='<div class="cat-tab'+(MENU_CAT_FILTER===c.id?' active':'')+(c.visible?'':' hidden-cat')+'" onclick="setMenuCat(\''+c.id+'\')">'+esc(c.name)+(c.visible?'':' <span title="Hidden from POS">🙈</span>')+'</div>';
  });
  tabs+='</div>';
  var items=STATE.menuItems.filter(function(it){ return MENU_CAT_FILTER==='all'||(it.catIds||[]).indexOf(MENU_CAT_FILTER)>-1; });
  var grid='';
  if(!items.length){ grid='<div class="empty-note">No items here yet. Click <b>+ New Item</b> to add one.</div>'; }
  else items.forEach(function(it){ grid+=menuCard(it); });
  return sectionHead('Food Menu','Build the kitchen menu. Items can live in multiple categories; hide a category to keep it off the POS.',btns)+
    tabs+'<div class="menu-grid">'+grid+'</div>';
}
function setMenuCat(id){ MENU_CAT_FILTER=id; $('content').innerHTML=menuBody(); }
function menuCard(it){
  var al=(it.allergens||[]).map(function(a){return chip(a,'chip-al');}).join('');
  var dt=(it.diet||[]).slice(0,4).map(function(d){return chip(d,'chip-diet');}).join('');
  var cats=(it.catIds||[]).map(function(c){return catName(c);}).filter(Boolean).join(' · ');
  var photoThumb=it.photoUrl?'<img src="'+esc(it.photoUrl)+'" class="mc-photo">':'';
  return '<div class="menu-card" onclick="openItemEditor(\''+it.id+'\')">'+photoThumb+
    '<div class="mc-top"><span class="mc-code">#'+esc(it.code||'')+'</span>'+
      (it.verified?'<span class="mc-verified" title="Chef verified">✓ Verified</span>':'<span class="mc-unverified" title="Needs chef verification">⚠ Unverified</span>')+'</div>'+
    '<div class="mc-name serif">'+esc(it.name)+'</div>'+
    '<div class="mc-desc">'+esc(it.desc||'')+'</div>'+
    '<div class="mc-meta"><span>'+money(it.price)+'</span><span class="mc-dot">•</span><span>'+esc(it.station||'')+'</span><span class="mc-dot">•</span><span>'+(it.cookMin||0)+' min</span></div>'+
    '<div class="mc-cats">'+esc(cats)+'</div>'+
    (al?'<div class="mc-chips">'+al+'</div>':'')+
    (dt?'<div class="mc-chips">'+dt+'</div>':'')+
  '</div>';
}

function openItemEditor(id){
  var it = id ? STATE.menuItems.filter(function(x){return x.id===id;})[0] : {id:uid('m'),code:'',name:'',desc:'',price:0,cost:0,catIds:[],cookMin:10,station:KITCHEN_STATIONS[0],ingredients:'',allergens:[],diet:[],verified:false,modGroupIds:[],active:true};
  var isNew=!id;
  var catChecks=STATE.menuCats.map(function(c){ return '<label class="cbx"><input type="checkbox" class="ie-cat" value="'+c.id+'"'+((it.catIds||[]).indexOf(c.id)>-1?' checked':'')+'> '+esc(c.name)+'</label>'; }).join('');
  var modChecks=STATE.modGroups.map(function(g){ return '<label class="cbx"><input type="checkbox" class="ie-mod" value="'+g.id+'"'+((it.modGroupIds||[]).indexOf(g.id)>-1?' checked':'')+'> '+esc(g.name)+'</label>'; }).join('');
  var body='<div class="ie-form">'+
    '<div class="ff-row cols-3">'+fld('Item # (code)','<input class="input" id="ie-code" value="'+esc(it.code)+'" placeholder="e.g. 101">')+
      fld('Price ($)','<input class="input" id="ie-price" type="number" step="0.01" value="'+it.price+'">')+
      fld('Cost ($)','<input class="input" id="ie-cost" type="number" step="0.01" value="'+it.cost+'">')+'</div>'+
    fld('Name','<input class="input" id="ie-name" value="'+esc(it.name)+'" placeholder="Dish name">')+
    fld('Description (shown to customers on iPad menu & servers on POS)','<textarea class="input" id="ie-desc" rows="3" placeholder="Full description of the dish — ingredients, preparation, presentation">'+esc(it.desc)+'</textarea>')+
    fld('Photo','<div class="mc-photo-row"><div class="mc-photo-controls"><input class="input" id="ie-photo" value="'+esc(photoInputDisplayValue(it.photoUrl||''))+'" placeholder="'+(isDisplayablePhotoUrl(it.photoUrl)&&!photoInputDisplayValue(it.photoUrl)?'Photo attached — upload to replace':'Paste URL or Upload')+'" style="flex:1;" oninput="showPhotoPreview(this,this.value); if(typeof applyPhotoUrlToCurrent===\'function\') applyPhotoUrlToCurrent(this.value)"><label class="btn btn-gold btn-sm mm-photo-pick">📷 Upload<input type="file" accept="image/*" onchange="handleMenuItemPhotoPick(this)"></label></div><img class="upload-preview mm-photo-hero" alt="Dish photo"></div>')+
    '<div class="ff-row cols-2">'+fld('Cook time (minutes)','<input class="input" id="ie-cook" type="number" value="'+(it.cookMin||0)+'">')+
      fld('Kitchen station','<select class="input" id="ie-station">'+opts(KITCHEN_STATIONS,it.station)+'</select>')+'</div>'+
    fld('Categories (an item can be in several)','<div class="cbx-grid">'+catChecks+'</div>')+
    fld('POS modifier groups','<div class="cbx-grid">'+modChecks+'</div>')+
    fld('Ingredients (chef enters here → AI reads this)','<textarea class="input" id="ie-ing" rows="2" placeholder="e.g. sea bass, lime, red onion, cilantro">'+esc(it.ingredients||'')+'</textarea>')+
    '<button class="btn btn-analyze" id="ie-analyze" type="button">✨ Analyze Allergens & Dietary</button>'+
    '<div id="ie-analysis" class="analysis-box">'+renderAnalysis(it.allergens,it.diet,it.verified,'')+'</div>'+
  '</div>';
  openModal(isNew?'New Menu Item':'Edit Menu Item', body, isNew?'Add Item':'Save Item', function(){
    var code=$('ie-code').value.trim(), name=$('ie-name').value.trim();
    if(!name){ toast('Enter a name','error'); return false; }
    it.code=code; it.name=name; it.desc=$('ie-desc').value.trim();
    it.photoUrl=readPhotoUrlFromForm(it.photoUrl, it.id);
    if(it.photoUrl) rememberMenuPhoto(it.id, it.photoUrl);
    it.price=parseFloat($('ie-price').value)||0; it.cost=parseFloat($('ie-cost').value)||0;
    it.cookMin=parseInt($('ie-cook').value)||0; it.station=$('ie-station').value;
    it.ingredients=$('ie-ing').value.trim();
    it.catIds=Array.prototype.slice.call(document.querySelectorAll('.ie-cat:checked')).map(function(x){return x.value;});
    it.modGroupIds=Array.prototype.slice.call(document.querySelectorAll('.ie-mod:checked')).map(function(x){return x.value;});
    // allergens/diet/verified come from the analysis box (data attributes)
    var ab=$('ie-analysis');
    it.allergens=(ab.getAttribute('data-al')||'').split('|').filter(Boolean);
    it.diet=(ab.getAttribute('data-diet')||'').split('|').filter(Boolean);
    it.verified=$('an-verify')?$('an-verify').checked:it.verified;
    if(isNew)STATE.menuItems.push(it);
    if(it.photoUrl && typeof rememberMenuPhoto==='function') rememberMenuPhoto(it.id, it.photoUrl);
    saveMenu(); toast('Item saved','success'); render();
  }, function(){
    $('ie-analyze').addEventListener('click',function(){ runAnalysis(it); });
  }, id?'<button class="btn btn-danger" onclick="deleteMenuItem(\''+id+'\')">Delete</button>':'');
}
function runAnalysis(it){
  var text=$('ie-name').value+' — '+$('ie-ing').value+' '+$('ie-desc').value;
  var box=$('ie-analysis');
  box.innerHTML='<div class="an-loading">Analyzing…</div>';
  analyzeDietAI(text).then(function(ai){
    var res=ai||analyzeDietRules(text);
    box.setAttribute('data-al',(res.allergens||[]).join('|'));
    box.setAttribute('data-diet',(res.diet||[]).join('|'));
    box.innerHTML=renderAnalysis(res.allergens,res.diet,false,res.note+(res.source==='ai'?' (AI)':' (built-in rules)'));
  });
}
function renderAnalysis(allergens,diet,verified,note){
  allergens=allergens||[]; diet=diet||[];
  var al=allergens.length?allergens.map(function(a){return chip('⚠ '+a,'chip-al');}).join(''):'<span class="an-none">No common allergens detected</span>';
  var dt=diet.length?diet.map(function(d){return chip(d,'chip-diet');}).join(''):'<span class="an-none">—</span>';
  return '<div class="an-block"><div class="an-label">Allergens present</div><div class="an-chips">'+al+'</div></div>'+
    '<div class="an-block"><div class="an-label">Dietary suitability</div><div class="an-chips">'+dt+'</div></div>'+
    (note?'<div class="an-note">'+esc(note)+'</div>':'')+
    '<label class="cbx an-verify-row"><input type="checkbox" id="an-verify"'+(verified?' checked':'')+'> <b>Chef verified</b> — I confirm these allergen/dietary calls against actual prep and cross-contact.</label>';
}
function deleteMenuItem(id){
  if(!confirm('Delete this item?'))return;
  STATE.menuItems=STATE.menuItems.filter(function(x){return x.id!==id;});
  saveMenu(); closeModal();
  if(ROUTE==='menu' && typeof mmPaint==='function'){
    MM.sel={type:'book',id:'mb_dinner'}; MM.open.mb_dinner=true; mmPaint();
  } else render();
  toast('Item deleted','success');
}

/* ---- category manager ---- */
function openCatManager(){
  var rows=STATE.menuCats.map(function(c){
    return '<div class="cat-row"><input class="input cat-name" data-id="'+c.id+'" value="'+esc(c.name)+'">'+
      '<label class="cbx"><input type="checkbox" class="cat-vis" data-id="'+c.id+'"'+(c.visible?' checked':'')+'> Show on POS</label>'+
      '<button class="btn btn-danger btn-sm" onclick="deleteCat(\''+c.id+'\')">✕</button></div>';
  }).join('');
  var body='<div class="cat-manager">'+rows+'<button class="btn btn-ghost btn-sm" id="cat-add" type="button">+ Add Category</button></div>'+
    '<div class="hint-sm">Hidden categories still store items but do not appear on the POS or bar/manager screens.</div>';
  openModal('Manage Categories', body, 'Save', function(){
    document.querySelectorAll('.cat-name').forEach(function(inp){ var c=STATE.menuCats.filter(function(x){return x.id===inp.getAttribute('data-id');})[0]; if(c)c.name=inp.value.trim()||c.name; });
    document.querySelectorAll('.cat-vis').forEach(function(cb){ var c=STATE.menuCats.filter(function(x){return x.id===cb.getAttribute('data-id');})[0]; if(c)c.visible=cb.checked; });
    saveMenu(); toast('Categories saved','success'); render();
  }, function(){
    $('cat-add').addEventListener('click',function(){ STATE.menuCats.push({id:uid('c'),name:'New Category',visible:true}); openCatManager(); });
  });
}
function deleteCat(id){
  if(!confirm('Delete this category? Items stay but lose this tag.'))return;
  STATE.menuCats=STATE.menuCats.filter(function(x){return x.id!==id;});
  STATE.menuItems.forEach(function(it){ it.catIds=(it.catIds||[]).filter(function(c){return c!==id;}); });
  (STATE.menuBooks||[]).forEach(function(b){ if(b.groupIds) b.groupIds=b.groupIds.filter(function(x){return x!==id;}); });
  saveMenu();
  if(ROUTE==='menu' && typeof mmPaint==='function'){
    closeModal(); MM.sel={type:'book',id:'mb_dinner'}; MM.open.mb_dinner=true; mmPaint();
  } else openCatManager();
}

/* ---- modifier manager ---- */
function openModifierManager(){
  var groups=STATE.modGroups.map(function(g){
    var optRows=g.options.map(function(o){ return '<div class="mod-opt">'+esc(o.name)+(o.up?' <span class="up">+'+money(o.up)+'</span>':'')+'</div>'; }).join('');
    return '<div class="mod-group"><div class="mod-g-name">'+esc(g.name)+(g.multi?' <span class="mg-tag">multi</span>':' <span class="mg-tag">single</span>')+'</div><div class="mod-opts">'+optRows+'</div>'+
      '<button class="btn btn-ghost btn-sm" onclick="openModGroupEditor(\''+g.id+'\')">Edit</button></div>';
  }).join('');
  var body='<div class="mod-manager">'+groups+'<button class="btn btn-ghost btn-sm" onclick="openModGroupEditor(null)">+ Add Modifier Group</button></div>';
  openModal('POS Modifier Groups', body, 'Done', function(){});
}
function openModGroupEditor(id){
  var g=id?STATE.modGroups.filter(function(x){return x.id===id;})[0]:{id:uid('mg'),name:'',multi:false,required:false,options:[]};
  var optRows=g.options.map(function(o,i){ return '<div class="ff-row cols-2 mopt-row"><input class="input mopt-name" data-i="'+i+'" value="'+esc(o.name)+'" placeholder="Option name"><input class="input mopt-up" data-i="'+i+'" type="number" step="0.01" value="'+(o.up||0)+'" placeholder="Upcharge"></div>'; }).join('');
  var body='<div>'+fld('Group name','<input class="input" id="mg-name" value="'+esc(g.name)+'" placeholder="e.g. Temperature">')+
    '<label class="cbx"><input type="checkbox" id="mg-multi"'+(g.multi?' checked':'')+'> Allow multiple selections</label>'+
    '<div class="ff"><label>Options (name + optional upcharge)</label><div id="mg-opts">'+optRows+'</div>'+
    '<button class="btn btn-ghost btn-sm" id="mg-addopt" type="button">+ Add Option</button></div></div>';
  openModal(id?'Edit Modifier Group':'New Modifier Group', body, 'Save', function(){
    g.name=$('mg-name').value.trim()||'Group'; g.multi=$('mg-multi').checked;
    var names=document.querySelectorAll('.mopt-name'), ups=document.querySelectorAll('.mopt-up');
    g.options=[]; for(var i=0;i<names.length;i++){ var nm=names[i].value.trim(); if(nm)g.options.push({id:uid('mo'),name:nm,up:parseFloat(ups[i].value)||0}); }
    if(!id)STATE.modGroups.push(g);
    saveMenu(); toast('Modifier group saved','success'); openModifierManager();
  }, function(){
    $('mg-addopt').addEventListener('click',function(){ g.options.push({id:uid('mo'),name:'',up:0}); openModGroupEditor(g.id||(STATE.modGroups.push(g),g.id)); });
  }, id?'<button class="btn btn-danger" onclick="deleteModGroup(\''+id+'\')">Delete</button>':'');
}
function deleteModGroup(id){
  if(!confirm('Delete this modifier group?'))return;
  STATE.modGroups=STATE.modGroups.filter(function(x){return x.id!==id;});
  (STATE.menuItems||[]).forEach(function(it){ it.modGroupIds=(it.modGroupIds||[]).filter(function(x){return x!==id;}); });
  saveMenu();
  if(ROUTE==='menu' && typeof mmPaint==='function'){
    closeModal(); MM.tab='modifiers'; MM.sel={type:'book',id:'mb_dinner'}; mmPaint();
  } else openModifierManager();
}

/* ---- AI settings ---- */
function openAiSettings(){
  var body=fld('OpenAI API key (optional)','<input class="input" id="ai-key" value="'+esc(aiKey())+'" placeholder="sk-... (stored only in this browser)">')+
    '<div class="hint-sm">Leave blank to use the built-in rule-based analyzer (no key needed). If you paste your own key, the analyzer upgrades to full AI. Your key is stored only in this browser and is never sent to our servers.</div>';

/* ============================================================
   BAR — cocktails / beer / spirits
   ============================================================ */
var BAR_FILTER='All';
function PAGE_bar(){ return { title:'Bar', sub:STATE.bar.length+' items', body:barBody(), bind:null }; }
function barKinds(){ return ['All','Cocktail','Beer','Spirit']; }
function barBody(){
  var btns='<button class="btn btn-gold btn-sm" onclick="openBarEditor(null)">+ New Drink</button>';
  var tabs='<div class="cat-tabs">'+barKinds().map(function(k){ return '<div class="cat-tab'+(BAR_FILTER===k?' active':'')+'" onclick="setBarFilter(\''+k+'\')">'+k+'</div>'; }).join('')+'</div>';

  }).join('');
  if(!list.length)rows='<tr><td colspan="8" class="empty-note">No drinks in this category yet.</td></tr>';

    '<div class="table-wrap"><table class="dt"><thead><tr><th>Code</th><th>Name</th><th>Type</th><th>Price</th><th>Cost</th><th>Stock</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';

function setBarFilter(k){ BAR_FILTER=k; $('content').innerHTML=barBody(); }
function openBarEditor(id){
  var b=id?STATE.bar.filter(function(x){return x.id===id;})[0]:{id:uid('b'),code:'',kind:'Cocktail',name:'',desc:'',price:0,cost:0,stock:0,unit:'each',allergens:[],active:true};
  var body='<div class="ff-row cols-2">'+fld('Code','<input class="input" id="b-code" value="'+esc(b.code)+'">')+fld('Type','<select class="input" id="b-kind">'+opts(['Cocktail','Beer','Spirit'],b.kind)+'</select>')+'</div>'+
    fld('Name','<input class="input" id="b-name" value="'+esc(b.name)+'">')+
    fld('Description','<input class="input" id="b-desc" value="'+esc(b.desc||'')+'">')+
    '<div class="ff-row cols-3">'+fld('Price','<input class="input" id="b-price" type="number" step="0.01" value="'+b.price+'">')+fld('Cost','<input class="input" id="b-cost" type="number" step="0.01" value="'+b.cost+'">')+fld('Stock (bottles)','<input class="input" id="b-stock" type="number" value="'+b.stock+'">')+fld('Unit','<select class="input" id="b-unit">'+opts(INV_UNITS,b.unit)+'</select>')+'</div>';
  openModal(id?'Edit Drink':'New Drink', body, 'Save', function(){
    b.code=$('b-code').value.trim(); b.kind=$('b-kind').value; b.name=$('b-name').value.trim(); b.desc=$('b-desc').value.trim();
    b.price=parseFloat($('b-price').value)||0; b.cost=parseFloat($('b-cost').value)||0; b.stock=parseInt($('b-stock').value,10)||0; b.unit=$('b-unit').value;
    b.ozOnHand=(Number(b.bottleOz)||WINE_BOTTLE_OZ)*b.stock;
    if(!b.name){ toast('Enter a name','error'); return false; }
    if(!id)STATE.bar.push(b); saveBar(); toast('Saved','success'); render();
  }, null, id?'<button class="btn btn-danger" onclick="deleteBar(\''+id+'\')">Delete</button>':'');
}
function deleteBar(id){ if(!confirm('Delete this drink?'))return; STATE.bar=STATE.bar.filter(function(x){return x.id!==id;}); saveBar(); closeModal(); render(); toast('Deleted','success'); }

/* ============================================================
   WINE — by bottle & by glass, VIN
   ============================================================ */
var WINE_FILTER='';
function PAGE_wine(){ return { title:'Wine', sub:(STATE.wines||[]).length+' bottles · inventory follows sales', body:wineBody(), bind:bindWineSearch }; }
function wineMatches(w, q){
  if(!q) return true;
  var hay=((w.vin||'')+' '+(w.name||'')+' '+(w.vintage||'')+' '+(w.region||'')+' '+(w.size||'')+' '+(w.producer||'')).toLowerCase();
  return hay.indexOf(q)>-1;
}
function bindWineSearch(){
  var el=$('wine-q'); if(!el) return;
  el.addEventListener('input', function(){ WINE_FILTER=el.value; $('wine-table-body').innerHTML=wineRows(); $('wine-count').textContent=wineFiltered().length+' shown'; });
}
function wineFiltered(){
  var q=(WINE_FILTER||'').trim().toLowerCase();
  var list=(STATE.wines||[]).filter(function(w){ return wineMatches(w,q); });
  return list;
}
function wineRows(){
  var list=wineFiltered();
  if(list.length>250) list=list.slice(0,250);
  if(!list.length) return '<tr><td colspan="8" class="empty-note">No wines match. Search bin, name, vintage, or region.</td></tr>';
  return list.map(function(w){
    var low=w.stock<=3?' low':'';
    return '<tr onclick="openWineEditor(\''+w.id+'\')"><td>'+esc(w.vin||'')+'</td><td class="td-name">'+esc(w.name)+(w.size&&w.size!=='750ml'&&(w.name||'').indexOf(w.size)<0?' <span class="hint-sm">'+esc(w.size)+'</span>':'')+'</td><td>'+esc(w.vintage||'')+'</td><td>'+esc(w.region||'')+'</td><td>'+money(w.bottlePrice)+'</td><td class="stk'+low+'">'+w.stock+' btl</td><td>'+(w.ozOnHand!=null?w.ozOnHand+' oz':Math.round((w.stock||0)*(w.bottleOz||25)))+'</td><td class="td-go">Edit →</td></tr>';
  }).join('');
}
function wineBody(){
  var btns='<button class="btn btn-gold btn-sm" onclick="openWineEditor(null)">+ New Wine</button>';
  var n=(STATE.wines||[]).length;
  return sectionHead('Wine list', n+' bottle labels from 375 Park Ave. By-the-glass is not on this list. Stock starts at 12 / 6 / 2 bottles by price and drops when POS sells a bottle. Each 750ml bottle is 25 oz for later 6 oz and 2 oz pours.', btns)+
    '<div class="ff" style="max-width:420px;margin:0 0 12px"><label>Find a wine</label><input class="input" id="wine-q" value="'+esc(WINE_FILTER)+'" placeholder="Bin, producer, vintage, region"></div>'+
    '<div class="mini-note" id="wine-count">'+wineFiltered().length+' shown'+(wineFiltered().length>250?' (first 250)':'')+'</div>'+
    '<div class="table-wrap"><table class="dt"><thead><tr><th>VIN / Bin</th><th>Name</th><th>Vintage</th><th>Region</th><th>Bottle</th><th>Stock</th><th>Ounces</th><th></th></tr></thead><tbody id="wine-table-body">'+wineRows()+'</tbody></table></div>';
}
function openWineEditor(id){
  var w=id?STATE.wines.filter(function(x){return x.id===id;})[0]:{id:uid('w'),vin:'',name:'',producer:'',vintage:'',region:'',varietal:'',bottlePrice:0,glassPrice:0,stock:12,bottleOz:WINE_BOTTLE_OZ,ozOnHand:12*WINE_BOTTLE_OZ,openOz:0,size:'750ml',byTheGlass:false,active:true};
  var body='<div class="ff-row cols-2">'+fld('VIN / bin','<input class="input" id="w-vin" value="'+esc(w.vin)+'">')+fld('Vintage','<input class="input" id="w-vintage" value="'+esc(w.vintage)+'">')+'</div>'+
    fld('Name','<input class="input" id="w-name" value="'+esc(w.name)+'">')+

var REPORT_RANGE='monthly';
function PAGE_reports(){
  return { title:'Reports', sub:'Sales & profitability', body:reportsBody(), bind:drawReportCharts };
}
function saleChannels(){ return {menu:'Food',bar:'Bar',wine:'Wine',retail:'Retail'}; }
function reportsBody(){
  var btns='<button class="btn btn-ghost btn-sm" onclick="openRecordSale()">+ Record Sale</button>';
  var totals=salesTotals();
  var cards='<div class="rep-cards">'+
    metricCard('Gross Sales',money(totals.sales),totals.count+' sales recorded')+
    metricCard('Total Cost',money(totals.cost),'cost of goods')+
    metricCard('Gross Profit',money(totals.profit),totals.margin+'% margin')+
    metricCard('Avg Sale',money(totals.count?totals.sales/totals.count:0),'per transaction')+
  '</div>';
  var rangeSel='<div class="cat-tabs">'+['daily','monthly','annual'].map(function(r){ return '<div class="cat-tab'+(REPORT_RANGE===r?' active':'')+'" onclick="setReportRange(\''+r+'\')">'+r.charAt(0).toUpperCase()+r.slice(1)+'</div>'; }).join('')+'</div>';
  var note = STATE.sales.length ? '' : '<div class="hint-sm">No sales recorded yet. The POS will feed sales here automatically once it is built; meanwhile use <b>+ Record Sale</b> to see the reports populate.</div>';
  return sectionHead('Reports','Sales and profitability by category, across daily, monthly, and annual ranges. Profit = price − cost.',btns)+
    cards+note+rangeSel+
    '<div class="rep-charts"><div class="chart-card"><div class="chart-title">Sales & Profit over time</div><canvas id="repTrend" height="120"></canvas></div>'+
    '<div class="chart-card"><div class="chart-title">Sales by Category</div><canvas id="repCat" height="120"></canvas></div></div>';
}
function metricCard(label,val,sub){ return '<div class="rep-card"><div class="rc-label">'+esc(label)+'</div><div class="rc-val serif">'+val+'</div><div class="rc-sub">'+esc(sub)+'</div></div>'; }
function setReportRange(r){ REPORT_RANGE=r; $('content').innerHTML=reportsBody(); drawReportCharts(); }
function salesTotals(){
  var s=0,c=0; STATE.sales.forEach(function(x){ s+=x.price*x.qty; c+=x.cost*x.qty; });
  var profit=s-c; return {sales:s,cost:c,profit:profit,count:STATE.sales.length,margin:s?Math.round(profit/s*100):0};
}
function bucketKey(ts,range){
  var d=new Date(ts);
  if(range==='daily')return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  if(range==='monthly')return d.toLocaleDateString('en-US',{month:'short',year:'2-digit'});
  return ''+d.getFullYear();
}
var _repCharts=[];
function drawReportCharts(){
  _repCharts.forEach(function(c){ try{c.destroy();}catch(e){} }); _repCharts=[];
  if(typeof Chart==='undefined')return;
  // trend
  var buckets={}, order=[];
  STATE.sales.forEach(function(x){ var k=bucketKey(x.ts,REPORT_RANGE); if(!buckets[k]){buckets[k]={sales:0,profit:0};order.push(k);} buckets[k].sales+=x.price*x.qty; buckets[k].profit+=(x.price-x.cost)*x.qty; });
  var t=$('repTrend');
  if(t){ _repCharts.push(new Chart(t.getContext('2d'),{type:'bar',data:{labels:order,datasets:[
    {label:'Sales',data:order.map(function(k){return buckets[k].sales;}),backgroundColor:'#C9A84C'},
    {label:'Profit',data:order.map(function(k){return buckets[k].profit;}),backgroundColor:'#5FB48A'}
  ]},options:reportChartOpts()})); }
  // by category
  var chan=saleChannels(); var byCat={}; Object.keys(chan).forEach(function(k){byCat[chan[k]]=0;});
  STATE.sales.forEach(function(x){ var label=chan[x.refType]||x.category||'Other'; byCat[label]=(byCat[label]||0)+x.price*x.qty; });
  var labels=Object.keys(byCat), vals=labels.map(function(l){return byCat[l];});
  var cc=$('repCat');
  if(cc){ _repCharts.push(new Chart(cc.getContext('2d'),{type:'doughnut',data:{labels:labels,datasets:[{data:vals,backgroundColor:['#C9A84C','#E07A6B','#9BC4E2','#5FB48A','#E0A36B','#b98cc4']}]},options:{plugins:{legend:{position:'right',labels:{color:'#d8cdb8'}}}}})); }
}
function reportChartOpts(){ return {scales:{x:{ticks:{color:'#a99'},grid:{display:false}},y:{ticks:{color:'#a99'},grid:{color:'rgba(255,255,255,.05)'}}},plugins:{legend:{labels:{color:'#d8cdb8'}}}}; }

function openRecordSale(){
  var menuOpts=STATE.menuItems.map(function(m){return '<option value="menu:'+m.id+'">Food · '+esc(m.name)+' ('+money(m.price)+')</option>';}).join('');
  var barOpts=STATE.bar.map(function(b){return '<option value="bar:'+b.id+'">Bar · '+esc(b.name)+' ('+money(b.price)+')</option>';}).join('');
  var wineOpts=STATE.wines.map(function(w){return '<option value="wine:'+w.id+'">Wine · '+esc(w.name)+' (btl '+money(w.bottlePrice)+')</option>';}).join('');
  var retOpts=STATE.retail.map(function(p){return '<option value="retail:'+p.id+'">Retail · '+esc(p.name)+' ('+money(p.price)+')</option>';}).join('');
  var body=fld('Item','<select class="input" id="rs-item">'+menuOpts+barOpts+wineOpts+retOpts+'</select>')+
    '<div class="ff-row cols-2">'+fld('Quantity','<input class="input" id="rs-qty" type="number" value="1" min="1">')+fld('Date','<input class="input" id="rs-date" type="date" value="'+new Date().toISOString().slice(0,10)+'">')+'</div>'+
    '<div class="hint-sm">This simulates a POS sale so you can see reports and stock updates now. Real sales will flow in automatically once the POS is connected.</div>';
  openModal('Record Sale', body, 'Record', function(){
    var v=$('rs-item').value; if(!v){ toast('Pick an item','error'); return false; }
    var parts=v.split(':'), type=parts[0], rid=parts[1], qty=parseInt($('rs-qty').value)||1;
    var ts=new Date($('rs-date').value+'T12:00:00').getTime();
    var rec=resolveSale(type,rid); if(!rec){ toast('Item not found','error'); return false; }
    STATE.sales.push({id:uid('sale'),ts:ts,refType:type,refId:rid,name:rec.name,category:rec.category,qty:qty,price:rec.price,cost:rec.cost,channel:'manual'});
    decrementStock(type,rid,qty);
    saveSales(); toast('Sale recorded','success'); render();
  });
}
function resolveSale(type,rid){
  if(type==='menu'){ var m=STATE.menuItems.filter(function(x){return x.id===rid;})[0]; return m?{name:m.name,price:m.price,cost:m.cost,category:'Food'}:null; }
  if(type==='bar'){ var b=STATE.bar.filter(function(x){return x.id===rid;})[0]; return b?{name:b.name,price:b.price,cost:b.cost,category:b.kind}:null; }
  if(type==='wine'){ var w=STATE.wines.filter(function(x){return x.id===rid;})[0]; return w?{name:w.name,price:w.bottlePrice,cost:0,category:'Wine'}:null; }
  if(type==='retail'){ var p=STATE.retail.filter(function(x){return x.id===rid;})[0]; return p?{name:p.name,price:p.price,cost:p.cost,category:p.category}:null; }
  return null;
}
function decrementStock(type,rid,qty){
  if(type==='bar'){ var b=STATE.bar.filter(function(x){return x.id===rid;})[0]; if(b){ consumeBarSale(b, qty); saveBar(); } }
  else if(type==='wine'){ var w=STATE.wines.filter(function(x){return x.id===rid;})[0]; if(w){ consumeWineSale(w, qty, w.bottleOz||WINE_BOTTLE_OZ); saveWines(); } }
  else if(type==='retail'){ var p=STATE.retail.filter(function(x){return x.id===rid;})[0]; if(p){p.stock=Math.max(0,p.stock-qty);saveRetail();} }
}
/* ============================================================
   TASTING & PRIX FIXE MODULE
   Manages tasting menus (set courses, wine pairings) and
   prix fixe menus (customer-chosen courses with upcharges).
   Syncs to Firebase for POS, Kitchen, and iPad Menu apps.
   ============================================================ */

/* ---- STATE extensions ---- */
STATE.tastingMenus = lsGet('eh_tasting_menus', seedTastingMenus());
STATE.prixFixeMenus = lsGet('eh_prix_fixe_menus', seedPrixFixeMenus());
ensureScaliniDiningMenus();
applyMenuPhotos();

function scaliniBundle(){
  return (typeof EPICUREAN_SCALINI !== 'undefined' && EPICUREAN_SCALINI) ? EPICUREAN_SCALINI : null;
}
function cloneScalini(value){
  return JSON.parse(JSON.stringify(value));
}
function seedTastingMenus(){
  var bundle=scaliniBundle();
  if(bundle && bundle.tasting) return [cloneScalini(bundle.tasting)];
  return [];
}
function seedPrixFixeMenus(){
  var bundle=scaliniBundle();
  if(bundle && bundle.prixFixe) return [cloneScalini(bundle.prixFixe)];
  return [];
}
function hasDishPhotos(menu){
  var dishes=menu && menu.dishes;
  if(Array.isArray(dishes) && dishes.some(function(d){ return d && d.photoUrl; })) return true;
  var courses=menu && menu.courses;
  if(!Array.isArray(courses)) return false;
  return courses.some(function(c){
    return (c.options||[]).some(function(o){ return o && o.photoUrl; }) || !!(c && c.photoUrl);
  });
}
function ensureScaliniDiningMenus(){
  var bundle=scaliniBundle();
  if(!bundle) return false;
  var dummyPf={}; (bundle.dummyPrixFixeIds||[]).forEach(function(id){ dummyPf[id]=1; });
  var dummyTm={}; (bundle.dummyTastingIds||[]).forEach(function(id){ dummyTm[id]=1; });
  var changed=false;
  STATE.prixFixeMenus=(STATE.prixFixeMenus||[]).filter(function(p){ return p && !dummyPf[p.id]; });
  STATE.tastingMenus=(STATE.tastingMenus||[]).filter(function(t){ return t && !dummyTm[t.id]; });
  var pfSeed=cloneScalini(bundle.prixFixe);
  var tmSeed=cloneScalini(bundle.tasting);
  var pfIdx=-1;
  STATE.prixFixeMenus.forEach(function(p,i){ if(p.id===pfSeed.id) pfIdx=i; });
  if(pfIdx<0){ STATE.prixFixeMenus.unshift(pfSeed); changed=true; }
  else if(!hasDishPhotos(STATE.prixFixeMenus[pfIdx])){ STATE.prixFixeMenus[pfIdx]=pfSeed; changed=true; }
  var tmIdx=-1;
  STATE.tastingMenus.forEach(function(t,i){ if(t.id===tmSeed.id) tmIdx=i; });
  if(tmIdx<0){ STATE.tastingMenus.unshift(tmSeed); changed=true; }
  else if(!hasDishPhotos(STATE.tastingMenus[tmIdx])){ STATE.tastingMenus[tmIdx]=tmSeed; changed=true; }
  if(changed){
    lsSet('eh_prix_fixe_menus', STATE.prixFixeMenus);
    lsSet('eh_tasting_menus', STATE.tastingMenus);
  }
  return changed;
}

/* ---- Save functions ---- */
function saveTastingMenus(){
  lsSet('eh_tasting_menus', STATE.tastingMenus);
  return fbSetDoc('boh_shared','tasting_menus',{list:withoutEmbeddedPhotos(STATE.tastingMenus), updatedAt:Date.now()});
}
function savePrixFixeMenus(){
  lsSet('eh_prix_fixe_menus', STATE.prixFixeMenus);
  return fbSetDoc('boh_shared','prix_fixe_menus',{list:withoutEmbeddedPhotos(STATE.prixFixeMenus), updatedAt:Date.now()});
}

/* ---- Sync extensions ---- */
function normalizeTastingList(list){
  return (Array.isArray(list)?list:[]).filter(function(tm){return tm&&typeof tm==='object'&&tm.name;}).map(function(tm){
    tm.courses=Array.isArray(tm.courses)?tm.courses:[];
    tm.pairings=Array.isArray(tm.pairings)?tm.pairings:[];
    return tm;
  });
}
function normalizePrixFixeList(list){
  return (Array.isArray(list)?list:[]).filter(function(pf){return pf&&typeof pf==='object'&&pf.name;}).map(function(pf){
    pf.courses=Array.isArray(pf.courses)?pf.courses:[];
    pf.courses=pf.courses.map(function(course){
      course=course||{};
      course.options=Array.isArray(course.options)?course.options:[];
      if(!course.mode) course.mode=course.fireEach?'auto':'choose';
      return course;
    });
    pf.dishes=Array.isArray(pf.dishes)?pf.dishes:[];
    return pf;
  });
}
var _origSync = syncFromCloud;
syncFromCloud = function(){
  return _origSync().then(function(){
    if(!fbReady) return;
    return Promise.all([
      fbGetDoc('boh_shared','tasting_menus').then(function(d){ if(d&&d.list){ STATE.tastingMenus=normalizeTastingList(d.list); lsSet('eh_tasting_menus',STATE.tastingMenus); } }),
      fbGetDoc('boh_shared','prix_fixe_menus').then(function(d){ if(d&&d.list){ STATE.prixFixeMenus=normalizePrixFixeList(d.list); lsSet('eh_prix_fixe_menus',STATE.prixFixeMenus); } })
    ]).then(function(){
      if(ensureScaliniDiningMenus()){
        saveTastingMenus();
        savePrixFixeMenus();
      }
    });
  });
};

        pf.dishes.forEach(function(d){
          dishesHtml+='<div style="display:flex;align-items:center;justify-content:space-between;background:rgba(15,27,45,0.7);padding:0.5rem 0.75rem;border-radius:6px;border:1px solid rgba(255,255,255,0.06);gap:0.75rem;">'+
            '<div style="display:flex;align-items:center;gap:0.6rem;min-width:0;">'+
              (d.photoUrl?'<img src="'+esc(d.photoUrl)+'" onclick="event.stopPropagation(); showDishPhotoModal(\''+esc(d.photoUrl)+'\', \''+esc(d.name.replace(/'/g,"\\'") )+'\', \''+esc((d.desc||'').replace(/'/g,"\\'"))+'\')" alt="'+esc(d.name)+'" style="width:38px;height:38px;border-radius:4px;object-fit:cover;cursor:pointer;border:1px solid var(--gold-soft);flex-shrink:0;" title="Click to view photo">':'<div style="width:38px;height:38px;border-radius:4px;background:#1d3250;display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:0.6rem;flex-shrink:0;">No Pic</div>')+
              '<div style="min-width:0;">'+
                '<div style="color:var(--text);font-size:0.875rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(d.name)+'</div>'+
                '<div style="color:var(--text-dim);font-size:0.7rem;display:flex;gap:0.4rem;"><span>'+esc(d.course)+'</span></div>'+
              '</div>'+
            '</div>'+
            '<div style="text-align:right;flex-shrink:0;">'+
              '<div style="color:var(--green);font-size:0.8125rem;font-weight:600;">'+(d.upcharge>0?'+$'+d.upcharge:'Included')+'</div>'+
              (d.pairing?'<div style="color:var(--gold);font-size:0.68rem;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">🍷 '+esc(d.pairing)+'</div>':'')+

        dishesHtml='<div class="pf-courses">'+courseSum+'</div>';

        '<div class="tc-sub">'+esc(pf.subtitle||'')+'</div>'+

        dishesHtml+

  return sectionHead('Tasting & Prix Fixe','Create multi-course experiences. Tasting menus have fixed courses; Prix Fixe lets guests choose from options per course.',btns)+

/* ============================================================
   TASTING MENU EDITOR
   ============================================================ */
function openTastingEditor(id){
  var tm = id ? STATE.tastingMenus.filter(function(x){return x.id===id;})[0] : {
    id:uid('tm'), name:'', subtitle:'', price:0, duration:'~2 hours',
    courses:[], pairings:[], active:true, service:'dinner', createdAt:Date.now()
  };
  var isNew=!id;

  var courseRows=tm.courses.map(function(c,i){
    return '<div class="course-edit-row" data-i="'+i+'">'+
      '<span class="course-num">'+(i+1)+'</span>'+
      '<input class="input tm-c-name" placeholder="Course name" value="'+esc(c.name)+'">'+
      '<input class="input tm-c-desc" placeholder="Description" value="'+esc(c.desc||'')+'">'+
      '<select class="input tm-c-station">'+opts(KITCHEN_STATIONS,c.station)+'</select>'+
      '<input class="input tm-c-upcharge" type="number" step="0.01" placeholder="+$ Upcharge" value="'+(c.upcharge||0)+'" title="Extra charge (0=included)">'+
      '<span style="display:flex;gap:4px;align-items:center;flex-wrap:wrap;"><input class="input tm-c-photo" placeholder="Photo URL" value="'+esc(c.photoUrl||'')+'" style="flex:1;" oninput="showPhotoPreview(this,this.value)"><button type="button" class="btn btn-gold btn-sm" onclick="uploadPhoto(this.previousElementSibling)" style="white-space:nowrap;padding:4px 8px;font-size:11px;">📷</button>'+(c.photoUrl?'<img class="upload-preview" src="'+esc(c.photoUrl)+'" style="width:60px;height:40px;object-fit:cover;border-radius:4px;border:1px solid var(--gold-soft);">':'')+'</span>'+
      '<button class="btn btn-danger btn-sm tm-c-del" type="button" onclick="tmDelCourse(this)">✕</button>'+
    '</div>';
  }).join('');

  var pairingRows=tm.pairings.map(function(p,i){
    return '<div class="pairing-edit-row" data-i="'+i+'">'+
      '<input class="input tm-p-name" placeholder="Pairing name" value="'+esc(p.name)+'">'+
      '<input class="input tm-p-desc" placeholder="Description" value="'+esc(p.desc||'')+'">'+
      '<input class="input tm-p-price" type="number" step="0.01" placeholder="Price" value="'+(p.price||0)+'">'+
      '<button class="btn btn-danger btn-sm" type="button" onclick="tmDelPairing(this)">✕</button>'+
    '</div>';
  }).join('');

  var body='<div class="ie-form">'+
    '<div class="ff-row cols-2">'+
      fld('Menu Name','<input class="input" id="tm-name" value="'+esc(tm.name)+'" placeholder="e.g. Chef\'s Tasting">')+
      fld('Subtitle','<input class="input" id="tm-sub" value="'+esc(tm.subtitle||'')+'" placeholder="e.g. 7-Course Seasonal Journey">')+
    '</div>'+
    '<div class="ff-row cols-4">'+
      fld('Price (per person)','<input class="input" id="tm-price" type="number" step="0.01" value="'+tm.price+'">')+
      fld('Duration','<input class="input" id="tm-dur" value="'+esc(tm.duration||'')+'" placeholder="~3 hours">')+
      fld('Service','<select class="input" id="tm-service">'+opts(['breakfast','brunch','lunch','dinner','all day'],tm.service||'dinner')+'</select>')+
      fld('Status','<select class="input" id="tm-active">'+opts(['Active','Inactive'],tm.active?'Active':'Inactive')+'</select>')+
    '</div>'+
    '<div class="ff"><label>Courses (in order — these fire to kitchen course-by-course)</label>'+
      '<div id="tm-courses">'+courseRows+'</div>'+
      '<button class="btn btn-ghost btn-sm" id="tm-add-course" type="button">+ Add Course</button>'+
    '</div>'+
    '<div class="ff"><label>Wine Pairings (optional add-ons)</label>'+
      '<div id="tm-pairings">'+pairingRows+'</div>'+
      '<button class="btn btn-ghost btn-sm" id="tm-add-pairing" type="button">+ Add Pairing</button>'+
    '</div>'+
  '</div>';

  openModal(isNew?'New Tasting Menu':'Edit Tasting Menu', body, isNew?'Create':'Save', function(){
    tm.name=$('tm-name').value.trim();
    if(!tm.name){ toast('Enter a name','error'); return false; }
    tm.subtitle=$('tm-sub').value.trim();
    tm.price=parseFloat($('tm-price').value)||0;
    tm.duration=$('tm-dur').value.trim();
    tm.service=$('tm-service').value;
    tm.active=$('tm-active').value==='Active';

    // Collect courses
    var courseEls=document.querySelectorAll('.course-edit-row');
    tm.courses=[];
    courseEls.forEach(function(el,i){
      var name=el.querySelector('.tm-c-name').value.trim();
      if(name){
        tm.courses.push({
          num:i+1,
          name:name,
          desc:el.querySelector('.tm-c-desc').value.trim(),
          station:el.querySelector('.tm-c-station').value,
          upcharge:parseFloat(el.querySelector('.tm-c-upcharge').value)||0,
          photoUrl:(el.querySelector('.tm-c-photo')?el.querySelector('.tm-c-photo').value.trim():'')
        });
      }
    });

    // Collect pairings
    var pairEls=document.querySelectorAll('.pairing-edit-row');
    tm.pairings=[];
    pairEls.forEach(function(el){
      var name=el.querySelector('.tm-p-name').value.trim();
      if(name){
        tm.pairings.push({
          id:uid('p'),
          name:name,
          desc:el.querySelector('.tm-p-desc').value.trim(),
          price:parseFloat(el.querySelector('.tm-p-price').value)||0
        });
      }
    });

    if(isNew) STATE.tastingMenus.push(tm);
    saveTastingMenus(); toast('Tasting menu saved','success'); render();
  }, function(){
    $('tm-add-course').addEventListener('click', function(){
      var container=$('tm-courses');
      var idx=container.querySelectorAll('.course-edit-row').length;
      var row=document.createElement('div');
      row.className='course-edit-row';
      row.setAttribute('data-i',idx);
      row.innerHTML='<span class="course-num">'+(idx+1)+'</span>'+
        '<input class="input tm-c-name" placeholder="Course name" value="">'+
        '<input class="input tm-c-desc" placeholder="Description" value="">'+
        '<select class="input tm-c-station">'+opts(KITCHEN_STATIONS,'Sauté')+'</select>'+
        '<input class="input tm-c-upcharge" type="number" step="0.01" placeholder="+$ Upcharge" value="0" title="Extra charge (0=included)">'+
        '<span style="display:flex;gap:4px;align-items:center;flex-wrap:wrap;"><input class="input tm-c-photo" placeholder="Photo URL" value="" style="flex:1;" oninput="showPhotoPreview(this,this.value)"><button type="button" class="btn btn-gold btn-sm" onclick="uploadPhoto(this.previousElementSibling)" style="white-space:nowrap;padding:4px 8px;font-size:11px;">📷</button></span>'+
        '<button class="btn btn-danger btn-sm tm-c-del" type="button" onclick="tmDelCourse(this)">✕</button>';
      container.appendChild(row);
    });
    $('tm-add-pairing').addEventListener('click', function(){
      var container=$('tm-pairings');
      var row=document.createElement('div');
      row.className='pairing-edit-row';
      row.innerHTML='<input class="input tm-p-name" placeholder="Pairing name" value="">'+
        '<input class="input tm-p-desc" placeholder="Description" value="">'+
        '<input class="input tm-p-price" type="number" step="0.01" placeholder="Price" value="0">'+
        '<button class="btn btn-danger btn-sm" type="button" onclick="tmDelPairing(this)">✕</button>';
      container.appendChild(row);
    });
  }, id?'<button class="btn btn-danger" onclick="deleteTastingMenu(\''+id+'\')">Delete</button>':'');
}

function tmDelCourse(btn){ btn.closest('.course-edit-row').remove(); renumberCourses(); }
function tmDelPairing(btn){ btn.closest('.pairing-edit-row').remove(); }
function renumberCourses(){
  document.querySelectorAll('.course-edit-row').forEach(function(el,i){
    el.setAttribute('data-i',i);
    el.querySelector('.course-num').textContent=(i+1);
  });
}
function deleteTastingMenu(id){
  if(!confirm('Delete this tasting menu?')) return;
  STATE.tastingMenus=STATE.tastingMenus.filter(function(x){return x.id!==id;});
  saveTastingMenus(); closeModal(); render(); toast('Tasting menu deleted','success');
}

/* ============================================================
   PRIX FIXE EDITOR
   ============================================================ */
function openPrixFixeEditor(id){
  var pf = id ? STATE.prixFixeMenus.filter(function(x){return x.id===id;})[0] : {
    id:uid('pf'), name:'', subtitle:'', price:0,
    courses:[{id:uid('pfc'), label:'Appetizer', order:0},{id:uid('pfc'), label:'Main Course', order:1},{id:uid('pfc'), label:'Dessert', order:2}],
    dishes:[], active:true, service:'dinner', createdAt:Date.now()
  };
  var isNew=!id;

  /* Migrate old format: if pf has courses with options but no dishes array */
  if(!pf.dishes && pf.courses && pf.courses.length && pf.courses[0].options){
    pf.dishes=[];
    pf.courses.forEach(function(c,ci){
      (c.options||[]).forEach(function(o,oi){
        pf.dishes.push({id:o.id||uid('pfd'), name:o.name, desc:o.desc||'', upcharge:o.upcharge||0, photoUrl:o.photoUrl||'', course:c.label, order:oi});
      });
    });
    /* Convert courses to just labels */
    pf.courses=pf.courses.map(function(c,i){return {id:c.id||uid('pfc'), label:c.label, order:i};});
  }
  if(!pf.dishes) pf.dishes=[];
  /* Ensure courses have order */
  pf.courses.forEach(function(c,i){if(c.order===undefined) c.order=i;});

  /* Build sections manager */
  var sectionsHtml=pf.courses.sort(function(a,b){return a.order-b.order;}).map(function(c,i){
    return '<div class="pf-sec-row" data-sec-id="'+c.id+'">'+
      '<div class="pf-sec-order">'+
        '<button type="button" onclick="pfSecMove(this,-1)" title="Move up">▲</button>'+
        '<button type="button" onclick="pfSecMove(this,1)" title="Move down">▼</button>'+
      '</div>'+
      '<span style="font-size:12px;color:var(--text-dim);min-width:20px;text-align:center;">'+(i+1)+'</span>'+
      '<input class="input pf-sec-name" value="'+esc(c.label)+'" placeholder="Section name (e.g. Appetizer, Aperitivo)">'+
      '<select class="input pf-sec-mode" title="How this course is ordered and fired">'+opts(['choose','auto','entremets','later'], c.mode||'choose')+'</select>'+
      '<button type="button" class="btn btn-danger btn-sm" onclick="pfDelSection(this)" style="padding:4px 8px;font-size:11px;">✕</button>'+
    '</div>';
  }).join('');

  /* Build dish rows */
  var dishRows=pf.dishes.sort(function(a,b){
    var ca=pf.courses.find(function(c){return c.label===a.course;});
    var cb=pf.courses.find(function(c){return c.label===b.course;});
    var oa=ca?ca.order:99, ob=cb?cb.order:99;
    if(oa!==ob) return oa-ob;
    return (a.order||0)-(b.order||0);
  }).map(function(d,i){
    var courseOpts=pf.courses.map(function(c){return '<option value="'+esc(c.label)+'"'+(d.course===c.label?' selected':'')+'>'+esc(c.label)+'</option>';}).join('');
    var stationOpts=opts(['Garde Manger','Grill','Sauté','Pastry','Bar'], d.station||'Garde Manger');
    var photoPreview=d.photoUrl?'<img class="upload-preview" src="'+esc(d.photoUrl)+'" style="width:80px;height:56px;object-fit:cover;border-radius:6px;border:2px solid var(--gold-soft);">':'';
    var glassWines=(STATE.wines||[]).map(function(w){ return w.name+' ('+w.varietal+', $'+(w.glassPrice||12)+'/glass)'; });
    var wineOpts='<option value="">— Select Wine Pairing (Manual or AI) —</option>'+glassWines.map(function(w){ return '<option value="'+esc(w)+'"'+(d.pairing===w?' selected':'')+'>'+esc(w)+'</option>'; }).join('');
    return '<div class="pf-opt-row" data-dish-id="'+d.id+'">'+
      '<button class="btn btn-danger btn-sm btn-del-opt" type="button" onclick="pfDelOpt(this)">✕</button>'+
      '<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;">'+
        '<div class="pf-dish-order">'+
          '<button type="button" onclick="pfDishMove(this,-1)" title="Move up">▲</button>'+
          '<button type="button" onclick="pfDishMove(this,1)" title="Move down">▼</button>'+
        '</div>'+
        '<select class="pf-o-category" onchange="pfUpdatePreview()" title="Assign dish course">'+courseOpts+'</select>'+
        '<select class="input pf-o-station" title="Kitchen station routing">'+stationOpts+'</select>'+
      '</div>'+
      '<div class="pf-opt-fields">'+
        '<input class="input pf-o-name" placeholder="Dish name (e.g. Seared Scallops)" value="'+esc(d.name)+'">'+
        '<input class="input pf-o-up" type="number" step="0.01" placeholder="+$0 Extra Charge" value="'+(d.upcharge||0)+'" title="Extra charge on top of base prix fixe price">'+
      '</div>'+
      '<label style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;">Description</label>'+
      '<textarea class="input pf-o-desc" placeholder="Describe ingredients, preparation, and flavor profile for guests...">'+esc(d.desc||'')+'</textarea>'+
      '<label style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;margin-top:6px;">Allergens (comma separated)</label>'+
      '<input class="input pf-o-allergens" placeholder="Fish, Gluten, Dairy, Tree Nut, Shellfish, Egg" value="'+esc((d.allergens||[]).join(', '))+'">'+
      '<input class="input pf-o-note" placeholder="Kitchen note (e.g. Allow 12 minutes)" value="'+esc(d.cookNote||'')+'" style="margin-top:6px;">'+
      '<div style="margin-top:8px;">'+
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">'+
          '<label style="font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.4px;">Wine Pairing (Glass)</label>'+
          '<button type="button" class="btn btn-ghost btn-sm" onclick="aiSuggestWinePairing(this)" style="padding:2px 8px;font-size:11px;">✨ AI Suggest Pairing</button>'+
        '</div>'+
        '<select class="input pf-o-pairing">'+wineOpts+'</select>'+
      '</div>'+
      '<div class="pf-opt-photo-row" style="margin-top:8px;">'+
        '<input class="input pf-o-photo" placeholder="Photo URL" value="'+esc(d.photoUrl||'')+'" style="flex:1;" oninput="showPhotoPreview(this,this.value)">'+
        '<button type="button" class="btn btn-gold btn-sm" onclick="uploadPhoto(this.previousElementSibling)" style="padding:6px 10px;font-size:12px;">📷 Upload</button>'+
        photoPreview+
      '</div>'+
    '</div>';
  }).join('');

  var body='<div class="ie-form">'+
    '<div class="ff-row cols-2">'+
      fld('Menu Name','<input class="input" id="pf-name" value="'+esc(pf.name)+'" placeholder="e.g. Lunch Prix Fixe">')+
      fld('Subtitle','<input class="input" id="pf-sub" value="'+esc(pf.subtitle||'')+'" placeholder="e.g. Choose one from each course">')+
    '</div>'+
    '<div class="ff-row cols-3">'+
      fld('Base Price (per person)','<input class="input" id="pf-price" type="number" step="0.01" value="'+pf.price+'">')+
      fld('Service','<select class="input" id="pf-service">'+opts(['breakfast','brunch','lunch','dinner','all day'],pf.service||'dinner')+'</select>')+
      fld('Status','<select class="input" id="pf-active">'+opts(['Active','Inactive'],pf.active?'Active':'Inactive')+'</select>')+
    '</div>'+
    '<div class="pf-sections-mgr">'+
      '<h4>Course Sections (name &amp; order as shown to customer)</h4>'+
