<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'none'; form-action 'none'; base-uri 'none'"><title>BOH catalog — isolated local pilot</title><style>body{font:16px system-ui;max-width:1100px;margin:24px auto;padding:12px;background:#faf8f2;color:#242424}button,input,select{font:inherit;padding:8px;margin:4px;max-width:100%;box-sizing:border-box}section{border:1px solid #bbb;padding:12px;margin:12px 0}label{display:block}#notice{background:#fff0d7;padding:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}article{border-top:1px solid #ddd;padding:8px}.error{color:#981b13}nav{display:flex;flex-wrap:wrap}h1{font-size:24px}</style></head><body><h1>BOH unified catalog — local pilot</h1><p id="notice">LOCAL SIMULATION ONLY · No Firebase, kitchen, payment or production publishing. No sample menu is loaded automatically. Original BOH interface and records remain unchanged.</p><label>Explicit legacy or canonical JSON import <input id="import" type="file" accept="application/json"></label><button id="download">Download candidate JSON</button><button id="publish">Publish locally (simulation)</button><select id="rollback-release" aria-label="Previous release"></select><button id="rollback">Activate previous local release</button><p id="status" role="status"></p><section><h2>Create any menu</h2><label>Name <input id="menu-name"></label><label>Ordering rule <select id="menu-rule"><option value="individual">Individually priced</option><option value="fixed-price">Fixed-price course menu</option></select></label><label>Menu base price in cents (fixed-price only) <input id="menu-price" type="number" min="0" step="1"></label><label>Presentation group <input id="menu-group" value="FOOD"></label><button id="create-menu">Create menu</button></section><section><h2>Reusable selection rule</h2><label>Rule name <input id="rule-name"></label><label>Minimum choices <input id="rule-min" type="number" min="0" value="0"></label><label>Maximum choices (blank means unrestricted) <input id="rule-max" type="number" min="0"></label><label><input id="rule-auto" type="checkbox"> Automatic included offerings</label><label><input id="rule-deferred" type="checkbox"> Select/activate later</label><button id="create-rule">Create reusable rule</button></section><nav id="menus"></nav><div id="editor"></div><section><h2>Shared consumer preview</h2><select id="channel"><option value="pos">POS</option><option value="voice">Voice catalog context</option><option value="digital">Digital menu</option></select><div id="preview"></div></section><script type="module" src="pilot.mjs"></script></body></html>
